name: auravibes_workspace
publish_to: none
environment:
  sdk: ^3.12.0

workspace:
  - apps/auravibes_app
  - packages/auravibes_engine
  - packages/auravibes_ui
  - widgetbook

dev_dependencies:
  dart_code_linter: ^4.1.6
  dependency_validator: ^5.0.4
  import_sorter: ^5.0.0-releasecandidate.1
  melos: ^8.1.0
  riverpod_lint: 3.1.4
  very_good_analysis: ^10.3.0

dependency_overrides:
  # melos 8 needs cli_util ^0.5.0; flutter_launcher_icons 0.14.4 pins ^0.4.1 (no newer release).
  # 0.5.0 only deprecates applicationConfigHome (still present), safe override.
  cli_util: ^0.5.0
  # flutter_web_auth_2 6.0.0-alpha.4 still constrains window_to_front to ^0.1.0.
  window_to_front: 1.0.0

melos:
  sdkPath: .fvm/flutter_sdk
  categories:
    app:
      - "apps/**"
    packages:
      - "packages/**"
  command:
    bootstrap:
      runPubGetInParallel: false
      environment:
        sdk: ^3.12.0
  scripts:
    analyze:
      run: dart analyze --fatal-infos --fatal-warnings

    analyze:fix:
      run: dart fix --apply

    unused:files:
      run: dart run dart_code_linter:metrics check-unused-files --monorepo --exclude='{**/*.g.dart,**/*.freezed.dart,**/.dart_tool/**.dart,packages/auravibes_engine/lib/auravibes_engine.dart,packages/auravibes_engine/lib/auravibes_engine_internal.dart,packages/auravibes_engine/lib/src/agent_continuation_preparer.dart,packages/auravibes_engine/lib/src/agent_iteration_context.dart,packages/auravibes_engine/lib/src/agent_iteration_decision.dart,packages/auravibes_engine/lib/src/agent_runners.dart,packages/auravibes_engine/lib/src/agent_runtime.dart,packages/auravibes_engine/lib/src/agent_service.dart,packages/auravibes_engine/lib/src/agent_stop_service.dart,packages/auravibes_engine/lib/src/agent_stream_service.dart,packages/auravibes_engine/lib/src/agent_tool_decision_service.dart,packages/auravibes_engine/lib/src/agent_tool_execution_service.dart,packages/auravibes_engine/lib/src/aura_agent_service.dart,packages/auravibes_engine/lib/src/chat_result.dart,packages/auravibes_engine/lib/src/continue_agent_result.dart,packages/auravibes_engine/lib/src/namespaces/agent_namespace.dart,packages/auravibes_engine/lib/src/namespaces/conversations_namespace.dart,packages/auravibes_engine/lib/src/namespaces/tools_namespace.dart,packages/auravibes_engine/lib/src/prompt_messages.dart,packages/auravibes_engine/lib/src/sub_agents/sub_agent_runner.dart,packages/auravibes_engine/lib/src/sub_agents/sub_agent_tool_specs.dart,packages/auravibes_engine/lib/src/providers/agent_data_provider.dart,packages/auravibes_engine/lib/src/providers/agent_model_provider.dart,packages/auravibes_engine/lib/src/providers/agent_runtime_provider.dart,packages/auravibes_engine/lib/src/providers/agent_tool_provider.dart,packages/auravibes_engine/lib/src/resolved_tool_service.dart,packages/auravibes_engine/lib/src/skill_context_messages.dart,packages/auravibes_engine/lib/src/tool_call_actions.dart,packages/auravibes_engine/lib/src/tool_calls.dart,packages/auravibes_engine/lib/src/tool_execution_dispatcher.dart,packages/auravibes_engine/lib/src/tool_name_resolver.dart,packages/auravibes_engine/lib/src/tool_resume_service.dart,packages/auravibes_engine/lib/auravibes_engine.dart,packages/auravibes_engine/lib/src/genkit_providers/openai_codex.dart,packages/auravibes_engine/lib/src/genkit_providers/openai_compat_chat_options.dart,packages/auravibes_engine/lib/src/genkit_providers/openai_compat_reasoning.dart,packages/auravibes_engine/lib/src/genkit_providers/openrouter.dart,packages/auravibes_engine/lib/src/genkit_providers/chat_completions_provider.dart,packages/auravibes_engine/lib/src/skills/execution/app_skill_executor.dart,packages/auravibes_engine/lib/src/skills/execution/resolve_skill_url_template.dart,packages/auravibes_engine/lib/src/skills/execution/run_skill_url_template.dart,packages/auravibes_engine/lib/src/skills/execution/skill_http_client.dart,packages/auravibes_engine/lib/src/skills/models/app_skill_definition.dart,packages/auravibes_engine/lib/src/skills/models/app_skill_tool_callback.dart,packages/auravibes_engine/lib/src/skills/models/app_skill_tool_definition.dart,packages/auravibes_engine/lib/src/skills/models/app_skill_url_template.dart,packages/auravibes_engine/lib/src/skills/models/skill_credential_attribute_definition.dart,packages/auravibes_engine/lib/src/skills/models/skill_template_input_definition.dart,packages/auravibes_engine/lib/src/skills/models/skill_url_template.dart,packages/auravibes_engine/lib/src/skills/models/url_request.dart,packages/auravibes_engine/lib/src/skills/models/url_request_method.dart,packages/auravibes_engine/lib/src/skills/models/url_response.dart,packages/auravibes_engine/lib/src/skills/models/url_response_format.dart,packages/auravibes_engine/lib/src/skills/service_skills/service_skill_definitions.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/anthropic.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/brave.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/codex.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/duckduckgo.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/exa.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/firecrawl.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/gemini.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/jina.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/kagi.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/kimi.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/openai.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/parallel.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/perplexity.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/searxng.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/shared.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/synthetic.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/tavily.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/tinyfish.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/xai.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/zai.dart}' apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib
      description: Fail when unused Dart files are detected

    dcl:analyze:
      run: dart run dart_code_linter:metrics analyze apps/auravibes_app/lib apps/auravibes_app/test packages/auravibes_engine/lib packages/auravibes_engine/test packages/auravibes_ui/lib packages/auravibes_ui/test widgetbook/lib --set-exit-on-violation-level=noted
      description: Run legacy Dart Code Linter rule analysis manually

    unused:code:
      # Excluded app DTO files contain public create/state contracts that are tested
      # but not directly instantiated by current production flows.
      run: dart run dart_code_linter:metrics check-unused-code --monorepo --exclude='{**/*.freezed.dart,apps/auravibes_app/lib/domain/entities/compaction_settings.dart,apps/auravibes_app/lib/domain/entities/conversation_tool_entity.dart,apps/auravibes_app/lib/domain/entities/tool_permission_mode.dart,apps/auravibes_app/lib/domain/entities/tools_group_entity.dart,packages/auravibes_engine/lib/src/agent_runners.dart,packages/auravibes_engine/lib/src/aura_agent_service.dart,packages/auravibes_engine/lib/src/namespaces/agent_namespace.dart,packages/auravibes_engine/lib/src/namespaces/conversations_namespace.dart,packages/auravibes_engine/lib/src/namespaces/tools_namespace.dart,packages/auravibes_engine/lib/src/providers/agent_runtime_provider.dart,packages/auravibes_engine/lib/src/providers/agent_tool_provider.dart,packages/auravibes_engine/lib/src/skill_context_messages.dart,packages/auravibes_engine/lib/src/sub_agents/sub_agent_runner.dart,packages/auravibes_engine/lib/src/sub_agents/sub_agent_tool_specs.dart,packages/auravibes_engine/lib/src/tool_call_actions.dart,packages/auravibes_engine/lib/src/tool_calls.dart}' apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib
      description: Fail when production unused declarations are detected

    unnecessary:nullable:
      # Excluded callbacks/entities use null as behavior: fallback close flow,
      # Flutter-style disabled icon buttons, and patch fields.
      run: dart run dart_code_linter:metrics check-unnecessary-nullable --monorepo --exclude='{apps/auravibes_app/lib/domain/entities/conversation_entity.dart,apps/auravibes_app/lib/features/models/widgets/add_model_provider_widget.dart,packages/auravibes_ui/lib/src/atoms/aura_icon.dart}' apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib
      description: Fail when unnecessary nullable parameters are detected

    architecture:boundaries:
      run: dart tool/check_architecture_boundaries.dart
      description: Fail when package architecture boundaries are violated

    format:check:
      run: dart format --line-length 80 -o none --set-exit-if-changed .
      description: Check code formating

    format:fix:
      run: dart format --line-length 80 .
      description: Fix code formatting

    # Testing Scripts
    test:
      exec: flutter test --reporter=compact
      packageFilters:
        dirExists: test
      description: Run tests for all packages (fast, no coverage)

    test:coverage:
      exec: flutter test --coverage --reporter=compact
      packageFilters:
        dirExists: test
      description: Run tests for all packages with coverage

    test:ci:
      exec: flutter test --coverage --concurrency=2 --timeout=30s --reporter=compact
      packageFilters:
        dirExists: test
      description: Run tests in CI mode (coverage + optimized settings)

    # Code Generation Scripts
    generate:
      exec: dart run build_runner build --delete-conflicting-outputs
      description: Run code generation for all packages
      packageFilters:
        dependsOn: build_runner

    generate:watch:
      exec: dart run build_runner watch --delete-conflicting-outputs
      description: Run code generation in watch mode
      packageFilters:
        dependsOn: build_runner
      concurrency: 10

    generate:localization:
      # Run build_runner and format only the generated files
      exec: dart pub run easy_localization:generate -S assets/i18n -f keys -O lib/i18n -o locale_keys.dart --skip-unnecessary-keys && dart format lib/i18n/locale_keys.dart
      concurrency: 1
      orderDependents: true
      failFast: true
      packageFilters:
        dependsOn:
          - easy_localization

    clean:
      run: melos exec -- "flutter clean"
      description: Clean all packages

    # Validation Pipeline (for CI)
    validate:
      run: |
        melos analyze &&
        melos run unused:files &&
        melos run unused:code &&
        melos run unnecessary:nullable &&
        melos run architecture:boundaries &&
        melos run format:check &&
        melos run test
      description: Full validation pipeline (no coverage, fast)

    validate:ci:
      run: |
        melos analyze &&
        melos run unused:files &&
        melos run unused:code &&
        melos run unnecessary:nullable &&
        melos run architecture:boundaries &&
        melos run format:check &&
        melos run test:ci
      description: Validation pipeline with coverage (CI mode)

    validate:quick:
      run: |
        dart analyze --fatal-infos --fatal-warnings &&
        dart format --line-length 80 -o none --set-exit-if-changed .
      description: Quick validation for development (analyze + format)

    # Development Scripts
    outdated:
      run: flutter pub outdated
      description: Check for outdated dependencies

    upgrade:
      run: flutter pub upgrade
      description: Upgrade dependencies

    # Maintenance Scripts
    reset:
      description: Reset and regenerate all packages
      steps:
        - melos clean
        - melos bootstrap
        - melos run generate

    generate:flavors:
      exec: dart pub run flutter_flavorizr -f
      concurrency: 1
      orderDependents: true
      failFast: true
      packageFilters:
        dependsOn:
          - flutter_flavorizr

    generate:icons:
      exec: dart pub run flutter_launcher_icons
      concurrency: 1
      orderDependents: true
      failFast: true
      packageFilters:
        dependsOn:
          - flutter_launcher_icons
