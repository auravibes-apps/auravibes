name: auravibes_workspace
publish_to: none
environment:
  sdk: ^3.13.0

workspace:
  - apps/auravibes_app
  - apps/auravibes_server
  - packages/auravibes_engine
  - packages/auravibes_server_client
  - packages/auravibes_ui
  - widgetbook

dev_dependencies:
  analyzer: ^14.0.0
  auravibes_app: ^0.0.4
  dart_code_linter: ^4.4.3
  dependency_validator: ^5.0.5
  flutter_test:
    sdk: flutter
  import_sorter: ^5.0.0-releasecandidate.1
  marionette_cli: ^0.7.0
  marionette_mcp: 0.7.0
  melos: ^8.7.0
  path: ^1.9.1
  riverpod_lint: ^3.1.9
  sqlite3: ^3.5.2
  test: ^1.32.0
  very_good_analysis: ^11.0.0
  vm_service: ^15.3.0

dependency_overrides:
  # melos 8 needs cli_util ^0.5.0; flutter_launcher_icons 0.14.4 pins ^0.4.1 (no newer release).
  # 0.5.0 only deprecates applicationConfigHome (still present), safe override.
  cli_util: ^0.5.0
  # ponytail: drift_dev 2.34.5 needs sqlparser ^0.45; Serverpod beta.0 still caps ^0.44.3. Remove when Serverpod raises its constraint.
  sqlparser: 0.45.0
  # Flutter 3.47.4 pins test_api 0.7.12; test 1.32.0 requires 0.7.14.
  # Keep override until Flutter updates its flutter_test pin.
  test_api: 0.7.14

melos:
  sdkPath: .fvm/flutter_sdk
  categories:
    app:
      - "apps/**"
    packages:
      - "packages/**"
  command:
    bootstrap:
      runPubGetInParallel: true
      environment:
        sdk: ^3.13.0
  scripts:
    analyze:
      run: dart run tool/run_quiet.dart -- dart analyze --fatal-infos --fatal-warnings

    analyze:fix:
      run: dart fix --apply

    unused:files:
      # Preserve generated usage sources.
      run: dart run tool/run_quiet.dart -- dart run dart_code_linter:metrics check-unused-files --monorepo --exclude='{**/*.g.dart,**/*.freezed.dart}' apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib
      description: Fail when unused Dart files are detected

    dcl:analyze:
      run: dart run tool/run_quiet.dart -- dart run dart_code_linter:metrics analyze apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib widgetbook/lib --exclude='{**/*_test.dart,**/test/**}' --no-congratulate --set-exit-on-violation-level=warning
      description: Run legacy Dart Code Linter rule analysis manually

    unused:code:
      # App findings are family-level test overrides or a visible-for-testing
      # reader.
      # The server lib is an excluded usage root; DCL still counts its references.
      # Keep the server bin entrypoint in scope.
      # skill_control_tools.dart retains deprecated compatibility exports.
      run: dart run tool/run_quiet.dart -- dart run dart_code_linter:metrics check-unused-code --monorepo --exclude='{**/*.freezed.dart,apps/auravibes_server/lib/**,packages/auravibes_engine/lib/src/sub_agents/sub_agent_tool_specs.dart,apps/auravibes_app/lib/features/chats/providers/cloud_conversation_provider.dart,apps/auravibes_app/lib/features/chats/providers/conversation_selection_provider.dart,apps/auravibes_app/lib/features/chats/providers/message_id_list.dart,apps/auravibes_app/lib/features/tools/providers/mcp_repository_provider.dart,packages/auravibes_engine/lib/src/conversation_compaction.dart,packages/auravibes_engine/lib/src/provider_tool_exchange.dart,packages/auravibes_engine/lib/src/skills/skill_control_tools.dart,packages/auravibes_engine/lib/src/tool_schema_strictification.dart}' apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib apps/auravibes_server/lib apps/auravibes_server/bin
      description: Fail when production unused declarations are detected

    unnecessary:nullable:
      # Excluded callbacks/entities use null as behavior: fallback close flow,
      # disabled icon buttons, patch fields, and context revocation.
      run: dart run tool/run_quiet.dart -- dart run dart_code_linter:metrics check-unnecessary-nullable --monorepo --exclude='{packages/auravibes_ui/lib/src/atoms/aura_icon_button.dart,apps/auravibes_app/lib/features/chats/services/cloud_chat_gateway.dart,apps/auravibes_app/lib/features/chats/widgets/chat_messages_widget.dart,packages/auravibes_engine/lib/src/provider_tool_exchange.dart,apps/auravibes_app/lib/data/repositories/local_workspace_context_repository.dart}' apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib
      description: Fail when unnecessary nullable parameters are detected

    format:check:
      run: dart run tool/run_quiet.dart -- dart format --line-length 80 -o none --set-exit-if-changed .
      description: Check code formating

    format:fix:
      run: dart format --line-length 80 .
      description: Fix code formatting

    analyze:workspace:
      run: dart run tool/run_quiet.dart --stream -- dart run melos analyze
      description: Run built-in Melos workspace analysis

    # Testing Scripts
    test:local:
      exec:
        command: |
          if [ -f test/integration/test_tools/serverpod_test_tools.dart ]; then
            fvm dart test test/features test/migrations --reporter=compact
          elif grep -q '^  flutter:' pubspec.yaml; then
            flutter test --exclude-tags=integration --reporter=compact
          else
            fvm dart test --exclude-tags=integration --reporter=compact
          fi
        # FVM has one global Flutter startup lock, so app/UI tests cannot start together.
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Run hermetic unit and widget tests without integrations

    test:integration:
      exec: bash "$MELOS_ROOT_PATH/scripts/test_server.sh"
      packageFilters:
        scope: auravibes_server
        dirExists: test/integration
      description: Run Docker-backed Serverpod integration tests

    test:coverage:
      exec: |
        if grep -q '^  flutter:' pubspec.yaml; then
          flutter test --coverage --reporter=compact
        else
          fvm dart test --coverage=coverage --reporter=compact &&
            fvm dart run coverage:format_coverage --lcov --in=coverage \
              --out=coverage/lcov.info --report-on=lib
        fi
      packageFilters:
        dirExists: test
      description: Run tests with coverage and emit package LCOV reports

    test:ci:
      exec: |
        if [ -f test/integration/test_tools/serverpod_test_tools.dart ]; then
          dart test test/features test/migrations --coverage=coverage \
            --concurrency=2 --timeout=30s --reporter=failures-only &&
            dart run coverage:format_coverage --lcov --in=coverage \
              --out=coverage/lcov.info --report-on=lib
        elif grep -q '^  flutter:' pubspec.yaml; then
          flutter test --exclude-tags=integration --coverage --concurrency=2 \
            --timeout=30s --reporter=failures-only
        else
          dart test --exclude-tags=integration --coverage=coverage \
            --concurrency=2 --timeout=30s --reporter=failures-only &&
            dart run coverage:format_coverage --lcov --in=coverage \
              --out=coverage/lcov.info --report-on=lib
        fi
      packageFilters:
        dirExists: test
      description: Run CI tests with coverage using the package's test runner

    # Code Generation Scripts
    generate:
      exec: dart "$MELOS_ROOT_PATH/tool/run_quiet.dart" -- dart run build_runner build
      description: Run code generation for all packages
      packageFilters:
        dependsOn: build_runner

    generate:serverpod:
      run: |
        cd apps/auravibes_server
        dart ../../tool/run_quiet.dart -- serverpod generate --force || exit $?
        cd ../..
        # ponytail: Serverpod beta output differs by platform; remove when upstream generation is deterministic.
        find apps/auravibes_server/lib/src/generated \
          apps/auravibes_server/test/integration/test_tools/serverpod_test_tools.dart \
          packages/auravibes_server_client/lib/src/protocol \
          -name '*.dart' -exec perl -0pi -e 's!(// ignore_for_file: no_leading_underscores_for_library_prefixes)\n(// ignore_for_file: no_leading_underscores_for_local_identifiers)\n\n(import )!$2\n\n$1\n$3!g; s!(// ignore_for_file: no_leading_underscores_for_library_prefixes)\n\n(import )!$1\n$2!g' {} +
        dart tool/run_quiet.dart -- dart format --line-length 80 \
          apps/auravibes_server/lib/src/generated \
          apps/auravibes_server/test/integration/test_tools/serverpod_test_tools.dart \
          packages/auravibes_server_client/lib/src/protocol
      description: Regenerate and format Serverpod server and client artifacts

    generate:watch:
      exec: dart run build_runner watch
      description: Run code generation in watch mode
      packageFilters:
        dependsOn: build_runner
      concurrency: 10

    generate:localization:
      # Run build_runner and format only the generated files
      exec: dart "$MELOS_ROOT_PATH/tool/run_quiet.dart" -- dart pub run easy_localization:generate -S assets/i18n -f keys -O lib/i18n -o locale_keys.dart --skip-unnecessary-keys && dart "$MELOS_ROOT_PATH/tool/run_quiet.dart" -- dart format lib/i18n/locale_keys.dart
      concurrency: 1
      orderDependents: true
      failFast: true
      packageFilters:
        dependsOn:
          - easy_localization

    clean:
      run: melos exec -- "dart \"$MELOS_ROOT_PATH/tool/run_quiet.dart\" -- flutter clean"
      description: Clean all packages

    # Validation Pipeline (for CI)
    validate:
      steps:
        - melos run analyze:workspace
        - melos run unused:files
        - melos run unused:code
        - melos run unnecessary:nullable
        - melos run format:check
        - melos run test:local
      description: Full workspace validation without coverage

    validate:ci:
      steps:
        - melos run analyze:workspace
        - melos run unused:files
        - melos run unused:code
        - melos run unnecessary:nullable
        - melos run format:check
        - melos run test:ci
      description: Validation pipeline with coverage (CI mode)

    validate:quick:
      steps:
        - melos run analyze
        - melos run format:check
      description: Quick validation for development (analyze + format)

    validate:changed:
      run: dart run tool/validate_changed_dart.dart
      description: Format and analyze changed Dart files

    validate:generated:
      run: |
        set -e
        if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
          echo "Run validate:generated from a clean worktree." >&2
          exit 2
        fi
        melos run generate --no-select
        melos run generate:serverpod
        if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
          echo "Generated artifacts are out of date; inspect and commit the generated diff." >&2
          git status --short --untracked-files=all
          exit 1
        fi
      description: Check generated artifacts for drift (requires clean worktree)

    validate:app:
      steps:
        - dart analyze apps/auravibes_app --fatal-infos --fatal-warnings --format=machine
        - dart run dependency_validator -C apps/auravibes_app
      description: Validate app analysis and declared dependencies

    validate:pr:
      steps:
        - melos run format:check
        - dart run import_sorter:main --exit-if-changed
        - dart run tool/check_benchmark_imports.dart
        - melos run analyze:workspace
        - melos run dcl:analyze
        - cd apps/auravibes_app && dart run tool/localization_audit.dart
      description: Run CI formatting, analysis, DCL, and localization checks

    # Development Scripts
    outdated:
      run: flutter pub outdated
      description: Check for outdated dependencies

    start:
      run: cd apps/auravibes_app && fvm flutter run --flavor dev --dart-define=AURAVIBES_SERVER_URL=http://localhost:8080/ "--dart-define=DB_HASH_SOURCE=$MELOS_ROOT_PATH"
      stdio: inherit
      description: Run AuraVibes app with workspace data

    start:device-preview:
      run: cd apps/auravibes_app && fvm flutter run -d macos --flavor dev --target tool/main_device_preview.dart --dart-define=AURAVIBES_SERVER_URL=http://localhost:8080/ "--dart-define=DB_HASH_SOURCE=$MELOS_ROOT_PATH"
      stdio: inherit
      description: Run AuraVibes app with device preview

    start:shared:
      run: cd apps/auravibes_app && fvm flutter run --flavor dev --dart-define=AURAVIBES_SERVER_URL=http://localhost:8080/
      stdio: inherit
      description: Run AuraVibes app with shared data

    start:marionette:
      run: fvm dart run tool/marionette_run.dart
      stdio: inherit
      description: Run AuraVibes app for Marionette MCP control

    start:server:
      run: cd apps/auravibes_server && fvm dart run bin/main.dart --mode development --apply-migrations
      stdio: inherit
      description: Run AuraVibes Server in development mode

    start:widgetbook:
      run: cd widgetbook && fvm flutter run
      stdio: inherit
      description: Run Widgetbook

    upgrade:
      run: flutter pub upgrade
      description: Upgrade dependencies

    # Maintenance Scripts
    reset:
      description: Reset and regenerate all packages
      steps:
        - melos clean
        - melos bootstrap
        - melos run generate

    generate:flavors:
      exec: dart "$MELOS_ROOT_PATH/tool/run_quiet.dart" -- dart pub run flutter_flavorizr -f
      concurrency: 1
      orderDependents: true
      failFast: true
      packageFilters:
        dependsOn:
          - flutter_flavorizr

    generate:icons:
      exec: dart "$MELOS_ROOT_PATH/tool/run_quiet.dart" -- dart pub run flutter_launcher_icons
      concurrency: 1
      orderDependents: true
      failFast: true
      packageFilters:
        dependsOn:
          - flutter_launcher_icons
