name: auravibes_workspace
publish_to: none
environment:
  sdk: ^3.13.0

workspace:
  - apps/auravibes_app
  - apps/auravibes_server
  - packages/auravibes_engine
  - packages/auravibes_server_client
  - packages/auravibes_ui
  - widgetbook

dev_dependencies:
  analyzer: ^13.0.0
  dart_code_linter: ^4.3.0
  dependency_validator: ^5.0.5
  import_sorter: ^5.0.0-releasecandidate.1
  melos: ^8.6.0
  riverpod_lint: 3.1.8
  test: 1.31.1
  very_good_analysis: ^11.0.0-rc.1

dependency_overrides:
  # melos 8 needs cli_util ^0.5.0; flutter_launcher_icons 0.14.4 pins ^0.4.1 (no newer release).
  # 0.5.0 only deprecates applicationConfigHome (still present), safe override.
  cli_util: ^0.5.0
  # ponytail: Flutter 3.47.1 pins test_api 0.7.11; test 1.31.1 needs 0.7.12.
  # ponytail: drift_dev 2.34.5 needs sqlparser ^0.45; Serverpod beta.0 still caps ^0.44.3. Remove when Serverpod raises its constraint.
  sqlparser: 0.45.0
  test_api: 0.7.12
  # flutter_web_auth_2 6.0.0-alpha.4 still constrains window_to_front to ^0.1.0.
  window_to_front: 1.0.0

melos:
  sdkPath: .fvm/flutter_sdk
  categories:
    app:
      - "apps/**"
    packages:
      - "packages/**"
  command:
    bootstrap:
      runPubGetInParallel: false
      environment:
        sdk: ^3.13.0
  scripts:
    analyze:
      run: dart analyze --fatal-infos --fatal-warnings

    analyze:fix:
      run: dart fix --apply

    unused:files:
      run: dart run dart_code_linter:metrics check-unused-files --monorepo --exclude='{**/*.g.dart,**/*.freezed.dart,**/.dart_tool/**.dart,packages/auravibes_ui/lib/**,packages/auravibes_engine/lib/auravibes_engine.dart,packages/auravibes_engine/lib/auravibes_engine_internal.dart,packages/auravibes_engine/lib/src/tool_approval_target.dart,packages/auravibes_engine/lib/src/tool_argument_validator.dart,packages/auravibes_engine/lib/src/tool_catalog.dart,packages/auravibes_engine/lib/src/skills/skill_command.dart,packages/auravibes_ui/lib/src/colors/contrast.dart,packages/auravibes_ui/lib/src/colors/color_contrast.dart,packages/auravibes_engine/lib/src/agent_continuation_preparer.dart,packages/auravibes_engine/lib/src/agent_iteration_context.dart,packages/auravibes_engine/lib/src/agent_iteration_decision.dart,packages/auravibes_engine/lib/src/agent_runners.dart,packages/auravibes_engine/lib/src/agent_runtime.dart,packages/auravibes_engine/lib/src/agent_service.dart,packages/auravibes_engine/lib/src/agent_stop_service.dart,packages/auravibes_engine/lib/src/agent_stream_service.dart,packages/auravibes_engine/lib/src/agent_tool_decision_service.dart,packages/auravibes_engine/lib/src/agent_tool_execution_service.dart,packages/auravibes_engine/lib/src/attachment_modality.dart,packages/auravibes_engine/lib/src/aura_agent_service.dart,packages/auravibes_engine/lib/src/chat_result.dart,packages/auravibes_engine/lib/src/context_window.dart,packages/auravibes_engine/lib/src/continue_agent_result.dart,packages/auravibes_engine/lib/src/genkit_providers/chat_completions_provider.dart,packages/auravibes_engine/lib/src/genkit_providers/openai_codex.dart,packages/auravibes_engine/lib/src/genkit_providers/openai_compat_chat_options.dart,packages/auravibes_engine/lib/src/genkit_providers/openai_compat_reasoning.dart,packages/auravibes_engine/lib/src/genkit_providers/openrouter.dart,packages/auravibes_engine/lib/src/mcp.dart,packages/auravibes_engine/lib/src/model_capabilities.dart,packages/auravibes_engine/lib/src/namespaces/agent_namespace.dart,packages/auravibes_engine/lib/src/namespaces/conversations_namespace.dart,packages/auravibes_engine/lib/src/namespaces/tools_namespace.dart,packages/auravibes_engine/lib/src/prompt_messages.dart,packages/auravibes_engine/lib/src/providers/agent_data_provider.dart,packages/auravibes_engine/lib/src/providers/agent_model_provider.dart,packages/auravibes_engine/lib/src/public_url_classifier.dart,packages/auravibes_engine/lib/src/resolved_tool_service.dart,packages/auravibes_engine/lib/src/skill_context_messages.dart,packages/auravibes_engine/lib/src/skills/execution/app_skill_executor.dart,packages/auravibes_engine/lib/src/skills/execution/resolve_skill_url_template.dart,packages/auravibes_engine/lib/src/skills/execution/run_skill_url_template.dart,packages/auravibes_engine/lib/src/skills/execution/skill_http_client.dart,packages/auravibes_engine/lib/src/skills/models/app_skill_definition.dart,packages/auravibes_engine/lib/src/skills/models/app_skill_tool_callback.dart,packages/auravibes_engine/lib/src/skills/models/app_skill_tool_definition.dart,packages/auravibes_engine/lib/src/skills/models/app_skill_url_template.dart,packages/auravibes_engine/lib/src/skills/models/skill_credential_attribute_definition.dart,packages/auravibes_engine/lib/src/skills/models/skill_template_input_definition.dart,packages/auravibes_engine/lib/src/skills/models/skill_url_template.dart,packages/auravibes_engine/lib/src/skills/models/url_request.dart,packages/auravibes_engine/lib/src/skills/models/url_request_method.dart,packages/auravibes_engine/lib/src/skills/models/url_response.dart,packages/auravibes_engine/lib/src/skills/models/url_response_format.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/anthropic.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/brave.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/codex.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/duckduckgo.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/exa.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/firecrawl.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/gemini.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/jina.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/kagi.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/kimi.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/openai.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/parallel.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/perplexity.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/searxng.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/shared.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/synthetic.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/tavily.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/tinyfish.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/xai.dart,packages/auravibes_engine/lib/src/skills/service_skills/providers/zai.dart,packages/auravibes_engine/lib/src/skills/service_skills/service_skill_definitions.dart,packages/auravibes_engine/lib/src/sub_agents/sub_agent_runner.dart,packages/auravibes_engine/lib/src/sub_agents/sub_agent_tool_specs.dart,packages/auravibes_engine/lib/src/tool_call_actions.dart,packages/auravibes_engine/lib/src/tool_calls.dart,packages/auravibes_engine/lib/src/tool_execution_dispatcher.dart,packages/auravibes_engine/lib/src/tool_name_resolver.dart,packages/auravibes_engine/lib/src/tool_resume_service.dart,packages/auravibes_engine/lib/src/tool_spec.dart,packages/auravibes_engine/lib/src/transcript_context.dart,packages/auravibes_engine/lib/src/transcript_selection.dart,packages/auravibes_engine/lib/src/url_content_format.dart,packages/auravibes_engine/lib/src/url_content_transformer.dart,packages/auravibes_engine/lib/src/conversation_compaction.dart,packages/auravibes_engine/lib/src/conversation_title.dart,packages/auravibes_engine/lib/src/models_dev_catalog.dart,packages/auravibes_engine/lib/src/provider_profile.dart,packages/auravibes_engine/lib/src/provider_tool_exchange.dart,packages/auravibes_engine/lib/src/skills/skill_control_tools.dart,packages/auravibes_engine/lib/src/skills/skill_eligibility.dart,packages/auravibes_engine/lib/src/skills/skill_tool_materialization.dart,packages/auravibes_engine/lib/src/skills/skills_manager.dart,packages/auravibes_engine/lib/src/url_tool.dart}' apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib
      description: Fail when unused Dart files are detected

    dcl:analyze:
      run: dart run dart_code_linter:metrics analyze apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib widgetbook/lib --exclude='{**/*_test.dart,**/test/**}' --set-exit-on-violation-level=noted
      description: Run legacy Dart Code Linter rule analysis manually

    unused:code:
      # Excluded app DTO files contain public create/state contracts that are tested
      # but not directly instantiated by current production flows.
      run: dart run dart_code_linter:metrics check-unused-code --monorepo --exclude='{**/*.freezed.dart,apps/auravibes_app/lib/data/repositories/attachment_file_store_io.dart,apps/auravibes_app/lib/features/chats/services/local_chat_attachment_service_io.dart,apps/auravibes_app/lib/features/chats/widgets/chat_attachment_image_io.dart,apps/auravibes_app/lib/features/skills/usecases/sync_skill_tool_permissions_usecase.dart,apps/auravibes_app/lib/features/workspaces/providers/workspace_availability.dart,apps/auravibes_app/lib/services/chatbot_service/chat_attachment_bytes_io.dart,apps/auravibes_app/lib/domain/entities/compaction_settings.dart,apps/auravibes_app/lib/domain/entities/conversation_tool_entity.dart,apps/auravibes_app/lib/domain/entities/tool_permission_mode.dart,apps/auravibes_app/lib/domain/entities/tools_group_entity.dart,packages/auravibes_ui/lib/src/atoms/aura_image.dart,packages/auravibes_engine/lib/src/agent_runners.dart,packages/auravibes_engine/lib/src/aura_agent_service.dart,packages/auravibes_engine/lib/src/namespaces/agent_namespace.dart,packages/auravibes_engine/lib/src/namespaces/conversations_namespace.dart,packages/auravibes_engine/lib/src/namespaces/tools_namespace.dart,packages/auravibes_engine/lib/src/providers/agent_runtime_provider.dart,packages/auravibes_engine/lib/src/providers/agent_tool_provider.dart,packages/auravibes_engine/lib/src/skill_context_messages.dart,packages/auravibes_engine/lib/src/sub_agents/sub_agent_runner.dart,packages/auravibes_engine/lib/src/sub_agents/sub_agent_tool_specs.dart,packages/auravibes_engine/lib/src/tool_call_actions.dart,packages/auravibes_engine/lib/src/tool_calls.dart,apps/auravibes_app/lib/features/chats/providers/cloud_conversation_provider.dart,apps/auravibes_app/lib/features/chats/providers/context_usage_level.dart,apps/auravibes_app/lib/features/chats/providers/conversation_selection_provider.dart,apps/auravibes_app/lib/features/chats/providers/message_id_list.dart,apps/auravibes_app/lib/features/skills/providers/cloud_skill_store_provider.dart,apps/auravibes_app/lib/features/tools/notifiers/conversation_tool_state.dart,apps/auravibes_app/lib/features/tools/notifiers/grouped_tools_notifier.dart,apps/auravibes_app/lib/features/tools/providers/mcp_repository_provider.dart,apps/auravibes_app/lib/features/tools/providers/workspace_tools_notifier.dart,apps/auravibes_app/lib/features/workspaces/providers/workspace_session_provider.dart,packages/auravibes_engine/lib/src/conversation_compaction.dart,packages/auravibes_engine/lib/src/mcp.dart,packages/auravibes_engine/lib/src/provider_profile.dart,packages/auravibes_engine/lib/src/provider_tool_exchange.dart,packages/auravibes_engine/lib/src/skills/skill_control_tools.dart,packages/auravibes_engine/lib/src/skills/skill_tool_materialization.dart,apps/auravibes_app/lib/features/tools/usecases/build_grouped_tools_view_use_case.dart,apps/auravibes_app/lib/domain/models/mcp_connection_view_status.dart}' apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib
      description: Fail when production unused declarations are detected

    unnecessary:nullable:
      # Excluded callbacks/entities use null as behavior: fallback close flow,
      # Flutter-style disabled icon buttons, and patch fields.
      run: dart run dart_code_linter:metrics check-unnecessary-nullable --monorepo --exclude='{apps/auravibes_app/lib/features/tools/widgets/tool_item_row.dart,apps/auravibes_app/lib/services/agent_harness/app_approve_tool_call_data_provider.dart,packages/auravibes_ui/lib/src/atoms/aura_icon_button.dart,apps/auravibes_app/lib/domain/entities/conversation_entity.dart,apps/auravibes_app/lib/features/models/widgets/add_model_provider_widget.dart,packages/auravibes_ui/lib/src/atoms/aura_icon.dart,apps/auravibes_app/lib/features/chats/agent_adapters/app_agent_continuation_adapter.dart,apps/auravibes_app/lib/features/chats/services/cloud_chat_gateway.dart,apps/auravibes_app/lib/features/chats/usecases/maybe_auto_compact_conversation_usecase.dart,apps/auravibes_app/lib/features/chats/widgets/chat_messages_widget.dart,apps/auravibes_app/lib/features/chats/widgets/chat_tool_approval_card.dart,apps/auravibes_app/lib/services/agent_harness/agent_tool_execution_service.dart,apps/auravibes_app/lib/services/agent_harness/approve_tool_call_service.dart,packages/auravibes_engine/lib/src/provider_tool_exchange.dart}' apps/auravibes_app/lib packages/auravibes_engine/lib packages/auravibes_ui/lib
      description: Fail when unnecessary nullable parameters are detected

    format:check:
      run: dart format --line-length 80 -o none --set-exit-if-changed .
      description: Check code formating

    format:fix:
      run: dart format --line-length 80 .
      description: Fix code formatting

    # Testing Scripts
    test:local:
      exec:
        command: |
          if [ -f test/integration/test_tools/serverpod_test_tools.dart ]; then
            fvm dart test test/features test/migrations --reporter=compact
          elif grep -q '^  flutter:' pubspec.yaml; then
            flutter test --exclude-tags=integration --reporter=compact
          else
            fvm dart test --exclude-tags=integration --reporter=compact
          fi
        # FVM has one global Flutter startup lock, so app/UI tests cannot start together.
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Run hermetic unit and widget tests without integrations

    test:integration:
      exec: fvm dart test test/integration --reporter=compact
      packageFilters:
        scope: auravibes_server
        dirExists: test/integration
      description: Run Docker-backed Serverpod integration tests

    test:coverage:
      exec: |
        if grep -q '^  flutter:' pubspec.yaml; then
          flutter test --coverage --reporter=compact
        else
          fvm dart test --coverage=coverage --reporter=compact &&
            fvm dart run coverage:format_coverage --lcov --in=coverage \
              --out=coverage/lcov.info --report-on=lib
        fi
      packageFilters:
        dirExists: test
      description: Run tests with coverage and emit package LCOV reports

    test:ci:
      exec: |
        if [ -f test/integration/test_tools/serverpod_test_tools.dart ]; then
          dart test test/features test/migrations --coverage=coverage \
            --concurrency=2 --timeout=30s --reporter=compact &&
            dart run coverage:format_coverage --lcov --in=coverage \
              --out=coverage/lcov.info --report-on=lib
        elif grep -q '^  flutter:' pubspec.yaml; then
          flutter test --exclude-tags=integration --coverage --concurrency=2 \
            --timeout=30s --reporter=compact
        else
          dart test --exclude-tags=integration --coverage=coverage \
            --concurrency=2 --timeout=30s --reporter=compact &&
            dart run coverage:format_coverage --lcov --in=coverage \
              --out=coverage/lcov.info --report-on=lib
        fi
      packageFilters:
        dirExists: test
      description: Run CI tests with coverage using the package's test runner

    # Code Generation Scripts
    generate:
      exec: dart run build_runner build
      description: Run code generation for all packages
      packageFilters:
        dependsOn: build_runner

    generate:serverpod:
      run: |
        cd apps/auravibes_server
        serverpod generate --force
        cd ../..
        # ponytail: Serverpod beta output differs by platform; remove when upstream generation is deterministic.
        find apps/auravibes_server/lib/src/generated \
          apps/auravibes_server/test/integration/test_tools/serverpod_test_tools.dart \
          packages/auravibes_server_client/lib/src/protocol \
          -name '*.dart' -exec perl -0pi -e 's!(// ignore_for_file: no_leading_underscores_for_library_prefixes)\n\n(import )!$1\n$2!g' {} +
        dart format --line-length 80 \
          apps/auravibes_server/lib/src/generated \
          apps/auravibes_server/test/integration/test_tools/serverpod_test_tools.dart \
          packages/auravibes_server_client/lib/src/protocol
      description: Regenerate and format Serverpod server and client artifacts

    generate:watch:
      exec: dart run build_runner watch
      description: Run code generation in watch mode
      packageFilters:
        dependsOn: build_runner
      concurrency: 10

    generate:localization:
      # Run build_runner and format only the generated files
      exec: dart pub run easy_localization:generate -S assets/i18n -f keys -O lib/i18n -o locale_keys.dart --skip-unnecessary-keys && dart format lib/i18n/locale_keys.dart
      concurrency: 1
      orderDependents: true
      failFast: true
      packageFilters:
        dependsOn:
          - easy_localization

    clean:
      run: melos exec -- "flutter clean"
      description: Clean all packages

    # Validation Pipeline (for CI)
    validate:
      steps:
        - melos analyze
        - melos run unused:files
        - melos run unused:code
        - melos run unnecessary:nullable
        - melos run format:check
        - melos run test:local
      description: Full validation pipeline (no coverage, fast)

    validate:ci:
      steps:
        - melos analyze
        - melos run unused:files
        - melos run unused:code
        - melos run unnecessary:nullable
        - melos run format:check
        - melos run test:ci
      description: Validation pipeline with coverage (CI mode)

    validate:quick:
      steps:
        - dart analyze --fatal-infos --fatal-warnings
        - dart format --line-length 80 -o none --set-exit-if-changed .
      description: Quick validation for development (analyze + format)

    # Development Scripts
    outdated:
      run: flutter pub outdated
      description: Check for outdated dependencies

    start:
      run: cd apps/auravibes_app && fvm flutter run --flavor dev --dart-define=AURAVIBES_SERVER_URL=http://localhost:8080/ "--dart-define=DB_HASH_SOURCE=$MELOS_ROOT_PATH"
      stdio: inherit
      description: Run AuraVibes app with workspace data

    start:shared:
      run: cd apps/auravibes_app && fvm flutter run --flavor dev --dart-define=AURAVIBES_SERVER_URL=http://localhost:8080/
      stdio: inherit
      description: Run AuraVibes app with shared data

    start:server:
      run: cd apps/auravibes_server && fvm dart run bin/main.dart --mode development --apply-migrations
      stdio: inherit
      description: Run AuraVibes Server in development mode

    start:widgetbook:
      run: cd widgetbook && fvm flutter run
      stdio: inherit
      description: Run Widgetbook

    upgrade:
      run: flutter pub upgrade
      description: Upgrade dependencies

    # Maintenance Scripts
    reset:
      description: Reset and regenerate all packages
      steps:
        - melos clean
        - melos bootstrap
        - melos run generate

    generate:flavors:
      exec: dart pub run flutter_flavorizr -f
      concurrency: 1
      orderDependents: true
      failFast: true
      packageFilters:
        dependsOn:
          - flutter_flavorizr

    generate:icons:
      exec: dart pub run flutter_launcher_icons
      concurrency: 1
      orderDependents: true
      failFast: true
      packageFilters:
        dependsOn:
          - flutter_launcher_icons
