# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "AuraVibes Flutter"

[setup]
script = "fvm use"

[[actions]]
name = "Bootstrap"
icon = "tool"
command = "fvm dart pub get && fvm dart run melos bootstrap"

[[actions]]
name = "Generate Code"
icon = "tool"
command = "fvm dart run melos run generate"

[[actions]]
name = "Analyze"
icon = "debug"
command = "fvm dart run melos run analyze"

[[actions]]
name = "Format Check"
icon = "tool"
command = "fvm dart run melos run format:check"

[[actions]]
name = "Test"
icon = "test"
command = "fvm dart run melos run test"

[[actions]]
name = "Start macOS App"
icon = "run"
command = '''
worktree="$(git rev-parse --show-toplevel)"
source "$worktree/scripts/serverpod_worktree_env.sh"
cd "$worktree/apps/auravibes_app"
fvm flutter run -d macos --flavor dev \
  --dart-define=AURAVIBES_SERVER_URL="$AURAVIBES_SERVER_URL" \
  "--dart-define=DB_HASH_SOURCE=$worktree"'''
platform = "darwin"

[[actions]]
name = "Start Linux App"
icon = "run"
command = '''
worktree="$(git rev-parse --show-toplevel)"
source "$worktree/scripts/serverpod_worktree_env.sh"
cd "$worktree/apps/auravibes_app"
fvm flutter run -d linux --flavor dev \
  --dart-define=AURAVIBES_SERVER_URL="$AURAVIBES_SERVER_URL" \
  "--dart-define=DB_HASH_SOURCE=$worktree"'''
platform = "linux"

[[actions]]
name = "Start Windows App"
icon = "run"
command = "cmd /c scripts/start_windows_app.cmd"
platform = "win32"

[[actions]]
name = "Start Server"
icon = "run"
command = "./scripts/start_server.sh"

[[actions]]
name = "Widgetbook (Web Server)"
icon = "tool"
command = '''
cd widgetbook
fvm flutter run -d web-server'''
