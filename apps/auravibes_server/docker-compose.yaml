services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:${AURAVIBES_SERVER_POSTGRES_PORT:-8090}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: auravibes_server
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - auravibes_server_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "127.0.0.1:${AURAVIBES_SERVER_REDIS_PORT:-8091}:6379"
    command: redis-server --requirepass "UWl-mNHNEUXv_xe0CWFzHBajGK1UV0B1"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:${AURAVIBES_SERVER_TEST_POSTGRES_PORT:-9090}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: auravibes_server_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - auravibes_server_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "127.0.0.1:${AURAVIBES_SERVER_TEST_REDIS_PORT:-9091}:6379"
    command: redis-server --requirepass "GZZj4HpiGxQK0g_kBQ3qWQMstI9y-Kze"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  auravibes_server_data:
  auravibes_server_test_data:
