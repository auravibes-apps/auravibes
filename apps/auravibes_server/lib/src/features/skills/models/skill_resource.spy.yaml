class: SkillResource
table: skill_resource
fields:
  workspaceId: int, relation(parent=cloud_workspace, onDelete=Cascade)
  skillId: String
  resourceId: String
  title: String
  slug: String
  description: String
  content: String
  revision: int
  createdAt: DateTime
  updatedAt: DateTime
  deletedAt: DateTime?
indexes:
  skill_resource_identity_idx:
    fields: workspaceId, resourceId
    unique: true
  skill_resource_parent_slug_idx:
    fields: workspaceId, skillId, slug
  skill_resource_active_idx:
    fields: workspaceId, skillId, deletedAt
