class: Conversation
table: conversation
fields:
  workspaceId: int, relation(parent=cloud_workspace, onDelete=NoAction)
  stableId: String
  title: String?
  isPinned: bool
  modelId: String?
  agentId: String?
  reasoningConfigJson: String?
  parentConversationStableId: String?
  revision: int
  projectionRevision: int, default=1
  eventSequence: int, default=0
  executionState: String, default='idle'
  activeExecutionId: int?
  activeCompactionCheckpointId: String?
  createdAt: DateTime
  updatedAt: DateTime
  deletedAt: DateTime?
  forkSourceConversationId: String?
  forkSourceTitle: String?
  forkThroughMessageId: String?
  forkMaterializedAt: DateTime?
indexes:
  conversation_workspace_stable_idx:
    fields: workspaceId, stableId
    unique: true
  conversation_workspace_idx:
    fields: workspaceId, updatedAt
  conversation_workspace_id_idx:
    fields: workspaceId, id
    unique: true
  conversation_fork_source_idx:
    fields: workspaceId, forkSourceConversationId
