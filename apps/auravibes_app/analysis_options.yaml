include: ../../analysis_options.yaml

dart_code_linter:
  rules:
    prefer-match-file-name:
      exclude:
        - lib/features/chats/usecases/conversation_busy_state.dart
        - lib/features/cloud_workspaces/models/cloud_workspace_state.dart
        - lib/features/skills/usecases/app_skill_credential_candidate.dart
        - lib/features/tools/usecases/tool_approval_decision.dart

analyzer:
  exclude:
    - "**/**.g.dart"
    - "lib/**.g.dart"
    - "**/**.freezed.dart"
    - "lib/**.freezed.dart"
    - "lib/i18n/*"
    - "build/**"
    - "lib/generated/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    public_member_api_docs: false
    ## temporal off
    flutter_style_todos: false
    discarded_futures: false
    unawaited_futures: false
    document_ignores: false
    unreachable_from_main: false
    cancel_subscriptions: false
