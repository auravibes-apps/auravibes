name: auravibes_app
resolution: workspace
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.0.4

environment:
  sdk: ^3.12.0

dependencies:
  async: ^2.13.0
  auravibes_engine: ^0.0.1
  auravibes_server_client: ^0.0.1
  auravibes_ui: ^0.0.2
  characters: ^1.4.1
  collection: ^1.19.1

  # Database dependencies
  crypto: ^3.0.7
  cryptography: ^2.9.0
  dio: ^5.10.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  easy_localization: ^3.0.8
  easy_localization_loader: ^2.0.2
  file_picker: ^12.0.0-beta.7
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  flutter_web_auth_2: ^6.0.0-alpha.4
  freezed_annotation: ^3.1.0
  genkit: ^0.15.1
  genkit_anthropic: ^0.2.11
  genkit_openai: ^0.3.7
  go_router: ^17.3.0
  hooks_riverpod: 3.4.2
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logging: ^1.3.0
  math_expressions: ^3.1.0
  mcp_client: ^2.0.0
  mime: ^2.0.0
  openai_dart: ^5.0.0

  # Other dependencies
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  riverpod: 3.4.2
  riverpod_annotation: 4.0.6
  rxdart: ^0.28.0
  schemantic: ^0.2.0
  serverpod_auth_core_client: 4.0.0-beta.0
  shared_preferences: ^2.5.4
  sqlite3_flutter_libs: ^0.6.0
  textf: ^2.0.0-dev.2
  url_launcher: ^6.3.2
  uuid: ^4.5.3
dev_dependencies:
  # Code generation for JSON serialization
  build_runner: ^2.15.0
  # Code generation for Drift
  drift_dev: ^2.34.0
  flutter_flavorizr: ^2.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: 4.0.0-dev.3
  go_router_builder: ^4.3.0
  json_serializable: ^6.14.0
  mocktail: ^1.0.4
  nock: ^1.2.3
  riverpod_generator: 4.0.8
  sqlite3: ^3.3.4
dependency_overrides:
  # Pin to 0.2.0: 0.3.0 Package.swift declares iOS 12 but uses CryptoKit (iOS 13+)
  flutter_secure_storage_darwin: 0.2.0

flutter:
  config:
    enable-swift-package-manager: true
  assets:
    - assets/i18n/
  uses-material-design: true

flavorizr:
  ide: "vscode"
  flavors:
    prod:
      app:
        name: "AuraVibes"

      android:
        applicationId: "me.auravibes.app"
      ios:
        bundleId: "me.auravibes.app"
      macos:
        bundleId: "me.auravibes.app"
        icon: "assets/launcher_icons/prod/macos.png"
    dev:
      app:
        name: "AuraVibes Dev"

      android:
        applicationId: "me.auravibes.app.dev"
      ios:
        bundleId: "me.auravibes.app.dev"
      macos:
        bundleId: "me.auravibes.app.dev"
        icon: "assets/launcher_icons/prod/macos.png"
    beta:
      app:
        name: "AuraVibes Beta"

      android:
        applicationId: "me.auravibes.app.beta"
      ios:
        bundleId: "me.auravibes.app.beta"
      macos:
        bundleId: "me.auravibes.app.beta"
        icon: "assets/launcher_icons/prod/macos.png"
  instructions:
    - assets:download
    - assets:extract
    - android:flavorizrGradle
    - android:buildGradle
    - android:androidManifest
    # - android:dummyAssets
    # - android:icons
    - ios:xcconfig
    - ios:buildTargets
    - ios:schema
    # - ios:dummyAssets
    # - ios:icons
    - ios:plist
    # - ios:launchScreen
    - macos:xcconfig
    - macos:configs
    - macos:buildTargets
    - macos:schema
    - macos:dummyAssets
    - macos:icons
    - macos:plist
    - flutter:flavors
    # - flutter:app
    # - flutter:pages
    # - flutter:main
    # - ide:config # monorepo needs to edit on root
    - assets:clean
