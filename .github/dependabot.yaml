# Dependabot configuration file - enable regular dependency checks.
version: 2
# ponytail: zero release delay; CI gates updates, PR volume is ceiling.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
      exclude:
        - "*"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
      exclude:
        - "*"
