name: Conversation export review evidence

on:
  push:
    branches: [codex/issue-1470-export-review]

permissions:
  contents: read

concurrency:
  group: issue-1470-export-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-capture:
    name: production archive review before
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BASELINE_SHA: 46065bc5983bc9dc9100696aaa3c98ba66c7c56b
    steps:
      - name: Checkout feature source for the shared capture fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve the revision-independent capture test
        run: cp apps/auravibes_app/test/widgets/ux_validation_layout_test.dart "$RUNNER_TEMP/ux_validation_layout_test.dart"

      - name: Checkout exact main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BASELINE_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Capture the production archive review before change
        working-directory: apps/auravibes_app
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/export-review-before-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/export-review-before-config
        run: |
          mkdir -p "$RUNNER_TEMP/export-review-before"
          cp "$RUNNER_TEMP/ux_validation_layout_test.dart" test/widgets/ux_validation_layout_test.dart
          python3 ../../tool/validation_lease.py --label export-review-before-capture -- flutter test test/widgets/ux_validation_layout_test.dart --no-pub --plain-name='conversation archive export review capture' --dart-define=EXPORT_REVIEW_CAPTURE_BASELINE=true --dart-define="UX_CAPTURE_DIR=$RUNNER_TEMP/export-review-before" --dart-define="UX_SOURCE_FINGERPRINT=$BASELINE_SHA"

      - name: Upload baseline screenshot and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conversation-export-review-before-${{ github.sha }}
          path: ${{ runner.temp }}/export-review-before/
          if-no-files-found: error
          retention-days: 14

  feature-capture:
    name: production archive review after
    needs: baseline-capture
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Prepare formatter patch for review
        working-directory: apps/auravibes_app
        run: |
          dart format --line-length 80 \
            lib/features/chats/models/conversation_archive.dart \
            lib/features/chats/usecases/conversation_archive_usecase.dart \
            lib/features/chats/widgets/chat_list_widget.dart \
            lib/features/chats/widgets/conversation_archive_export_review_dialog.dart \
            test/features/chats/models/conversation_archive_test.dart \
            test/features/chats/widgets/chat_list_widget_test.dart \
            test/widgets/ux_validation_layout_test.dart
          git -C ../.. diff --binary > "$RUNNER_TEMP/export-review-format.patch"

      - name: Upload formatter patch for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conversation-export-review-format-${{ github.sha }}
          path: ${{ runner.temp }}/export-review-format.patch
          if-no-files-found: warn
          retention-days: 3

      - name: Capture the production archive review after change
        working-directory: apps/auravibes_app
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/export-review-after-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/export-review-after-config
        run: |
          mkdir -p "$RUNNER_TEMP/export-review-after"
          python3 ../../tool/validation_lease.py --label export-review-after-capture -- flutter test test/widgets/ux_validation_layout_test.dart --no-pub --plain-name='conversation archive export review capture' --dart-define="UX_CAPTURE_DIR=$RUNNER_TEMP/export-review-after" --dart-define="UX_SOURCE_FINGERPRINT=$GITHUB_SHA"

      - name: Upload feature screenshot and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conversation-export-review-after-${{ github.sha }}
          path: ${{ runner.temp }}/export-review-after/
          if-no-files-found: error
          retention-days: 14
