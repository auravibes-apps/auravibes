name: Platform Build Matrix

on:
  workflow_call:

env:
  FLUTTER_WORKING_DIRECTORY: apps/auravibes_app

jobs:
  build-linux-targets:
    name: Build Android, Linux, and Web
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action/config@v3
        id: fvm-config-action

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}"

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 📦 Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev libwebkit2gtk-4.1-dev libsecret-1-dev

      - name: 🔗 Create FVM symlink for CI
        run: |
          mkdir -p .fvm
          ln -sfn "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: 📦 Melos Bootstrap
        uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5
        with:
          run-bootstrap: true

      - name: 🏗️ Build Android APK
        run: flutter build apk --debug --flavor prod --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🏗️ Build Linux
        run: flutter build linux --debug --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🏗️ Build Web
        run: flutter build web --release --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

  build-apple-targets:
    name: Build macOS and iOS
    runs-on: macos-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action/config@v3
        id: fvm-config-action

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}"

      - name: 🔗 Create FVM symlink for CI
        run: |
          mkdir -p .fvm
          ln -sfn "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: 📦 Melos Bootstrap
        uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5
        with:
          run-bootstrap: true

      - name: 🏗️ Configure macOS Build
        run: flutter build macos --debug --flavor prod --config-only --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🏗️ Build macOS (No Codesign)
        run: >-
          xcodebuild -project macos/Runner.xcodeproj -scheme Runner
          -configuration Debug-prod -derivedDataPath build/macos
          CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🏗️ Build iOS (No Codesign)
        run: flutter build ios --debug --no-codesign --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action/config@v3
        id: fvm-config-action

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}"

      - name: 🔗 Create FVM symlink for CI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .fvm | Out-Null
          if (Test-Path .fvm\flutter_sdk) { Remove-Item .fvm\flutter_sdk -Recurse -Force }
          New-Item -ItemType Junction -Path .fvm\flutter_sdk -Target "$env:FLUTTER_ROOT" | Out-Null

      - name: 📦 Melos Bootstrap
        uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5
        with:
          run-bootstrap: true

      - name: 🏗️ Build Windows
        run: flutter build windows --debug --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}
