name: Platform Build Matrix

on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of platforms to build.
        required: false
        type: string
        default: '["android","ios","macos","linux","windows","web"]'

permissions:
  contents: read

env:
  FLUTTER_WORKING_DIRECTORY: apps/auravibes_app

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # shortcut: the Linux WebView plugin needs WPE 1.0 packages absent on Noble; upgrade it before leaving Ubuntu 22.04.
    runs-on: ${{ (matrix.platform == 'ios' || matrix.platform == 'macos') && 'macos-latest' || (matrix.platform == 'windows' && 'windows-latest') || (matrix.platform == 'linux' && 'ubuntu-22.04') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🔧 Setup Flutter workspace
        if: ${{ matrix.platform != 'windows' }}
        uses: ./.github/actions/setup-workspace

      - name: 🔧 Setup FVM (Windows)
        if: ${{ matrix.platform == 'windows' }}
        uses: kuhnroyal/flutter-fvm-config-action/config@v3
        id: fvm-config-action

      - name: 🐦 Setup Flutter (Windows)
        if: ${{ matrix.platform == 'windows' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}"

      - name: 🔗 Create FVM symlink for CI (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .fvm | Out-Null
          if (Test-Path .fvm\flutter_sdk) { Remove-Item .fvm\flutter_sdk -Recurse -Force }
          New-Item -ItemType Junction -Path .fvm\flutter_sdk -Target "$env:FLUTTER_ROOT" | Out-Null

      - name: 📦 Melos Bootstrap (Windows)
        if: ${{ matrix.platform == 'windows' }}
        uses: bluefireteam/melos-action@b79b63bcd183f823740a7976cbdb4b0fc95a0eb8
        with:
          run-bootstrap: true

      - name: ☕ Setup Java
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
          cache: gradle
          cache-dependency-path: |
            apps/auravibes_app/android/**/*.gradle*
            apps/auravibes_app/android/gradle.properties
            apps/auravibes_app/android/gradle/wrapper/gradle-wrapper.properties

      - name: 📦 Install Linux Dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkgconf libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev libwebkit2gtk-4.0-dev libepoxy-dev libwayland-dev libwpewebkit-1.0-dev libwpe-1.0-dev libwpebackend-fdo-1.0-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-15-dev
          export PKG_CONFIG=/usr/bin/pkgconf
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          "$PKG_CONFIG" --short-errors --print-errors --exists gstreamer-1.0
          "$PKG_CONFIG" --modversion gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0
          echo "PKG_CONFIG=$PKG_CONFIG" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: 🏗️ Build Android APK
        if: ${{ matrix.platform == 'android' }}
        # Flutter 3.47.2 misidentifies AGP 9 built-in KGP 2.2.10; remove when validation supports it.
        run: flutter build apk --debug --flavor prod --no-pub --android-skip-build-dependency-validation
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🏗️ Configure macOS Build
        if: ${{ matrix.platform == 'macos' }}
        run: flutter build macos --debug --flavor prod --config-only --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🏗️ Build macOS (No Codesign)
        if: ${{ matrix.platform == 'macos' }}
        run: >-
          xcodebuild -project macos/Runner.xcodeproj -scheme Runner
          -configuration Debug-prod -derivedDataPath build/macos
          CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          MACOSX_DEPLOYMENT_TARGET=12.0 build
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🧪 Test iOS SQLite binary preparer
        if: ${{ matrix.platform == 'ios' }}
        run: bash tool/test_prepare_sqlite3_ios.sh

      - name: 🔑 Resolve iOS SQLite cache identity
        if: ${{ matrix.platform == 'ios' }}
        id: sqlite3_identity
        shell: bash
        run: |
          set -euo pipefail
          source tool/prepare_sqlite3_ios.sh
          sqlite3_version="$(sqlite3_version_from_lock pubspec.lock)"
          if ! sqlite3_ios_metadata "$sqlite3_version" >/dev/null; then
            echo "::error::No pinned iOS SQLite binary metadata for sqlite3 $sqlite3_version."
            exit 1
          fi
          flutter_version="$(awk -F'"' '$2 == "flutter" { print $4; exit }' .fvmrc)"
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { version = $2 } /^Build version / { build = $3 } END { if (version != "" && build != "") printf "%s-%s", version, build }')"
          cache_path=".dart_tool/hooks_runner/shared/sqlite3/build"

          if [[ -z "$sqlite3_version" || -z "$flutter_version" || -z "$xcode_version" ]]; then
            echo "::error::Could not resolve sqlite3, Flutter, or Xcode version for the iOS binary cache."
            exit 1
          fi

          mkdir -p "$cache_path"
          {
            printf 'sqlite3_version=%s\n' "$sqlite3_version"
            printf 'flutter_version=%s\n' "$flutter_version"
            printf 'xcode_version=%s\n' "$xcode_version"
            printf 'cache_path=%s\n' "$cache_path"
          } >> "$GITHUB_OUTPUT"

      # Unique snapshots let a verified repair replace a corrupted immutable cache entry.
      - name: ♻️ Restore verified iOS SQLite cache
        if: ${{ matrix.platform == 'ios' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.sqlite3_identity.outputs.cache_path }}
          key: sqlite3-ios-arm64-${{ runner.os }}-${{ runner.arch }}-sqlite-${{ steps.sqlite3_identity.outputs.sqlite3_version }}-flutter-${{ steps.sqlite3_identity.outputs.flutter_version }}-xcode-${{ steps.sqlite3_identity.outputs.xcode_version }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sqlite3-ios-arm64-${{ runner.os }}-${{ runner.arch }}-sqlite-${{ steps.sqlite3_identity.outputs.sqlite3_version }}-flutter-${{ steps.sqlite3_identity.outputs.flutter_version }}-xcode-${{ steps.sqlite3_identity.outputs.xcode_version }}-

      - name: 📥 Prepare verified iOS SQLite binary
        if: ${{ matrix.platform == 'ios' }}
        id: prepare_sqlite3
        run: ./tool/prepare_sqlite3_ios.sh

      - name: 💾 Save verified iOS SQLite cache
        if: ${{ success() && matrix.platform == 'ios' && steps.prepare_sqlite3.outputs.cache_state != 'hit' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.sqlite3_identity.outputs.cache_path }}
          key: sqlite3-ios-arm64-${{ runner.os }}-${{ runner.arch }}-sqlite-${{ steps.sqlite3_identity.outputs.sqlite3_version }}-flutter-${{ steps.sqlite3_identity.outputs.flutter_version }}-xcode-${{ steps.sqlite3_identity.outputs.xcode_version }}-run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 🏗️ Build iOS (No Codesign)
        if: ${{ matrix.platform == 'ios' }}
        run: flutter build ios --debug --no-codesign --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🏗️ Build Linux
        if: ${{ matrix.platform == 'linux' }}
        run: flutter build linux --debug --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🧪 Test Drift web asset verifier
        if: ${{ matrix.platform == 'web' }}
        run: bash tool/test_compile_drift_web.sh

      - name: 🔐 Compile Drift web worker and verify SQLite WASM
        if: ${{ matrix.platform == 'web' }}
        run: ./tool/compile_drift_web.sh --release

      - name: 🏗️ Build Web
        if: ${{ matrix.platform == 'web' }}
        run: flutter build web --release --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

      - name: 🩹 Patch Windows WebView CMake compatibility
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev" -Directory -Filter "flutter_inappwebview_windows_fx-*"
          if ($packages.Count -eq 0) { throw "flutter_inappwebview_windows_fx was not found in the pub cache" }

          foreach ($package in $packages) {
            $path = Join-Path $package.FullName "windows\CMakeLists.txt"
            $original = Get-Content $path -Raw
            $source = $original
            $expected = 'set(PLUGIN_NAME "flutter_inappwebview_windows_plugin")'
            $fixed = 'set(PLUGIN_NAME "flutter_inappwebview_windows_fx_plugin")'
            if ($source.Contains($expected)) {
              $source = $source.Replace($expected, $fixed)
            } elseif (-not $source.Contains($fixed)) {
              throw "Unexpected Windows plugin target in $path"
            }

            $deprecationDefinition = 'add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)'
            if (-not $source.Contains($deprecationDefinition)) {
              if (-not $source.Contains($fixed)) { throw "Windows plugin target marker not found in $path" }
              $source = $source.Replace($fixed, "$fixed`n$deprecationDefinition")
            }

            if ($source -ne $original) {
              [IO.File]::WriteAllText($path, $source, [Text.UTF8Encoding]::new($false))
            }
          }

      - name: 🏗️ Build Windows
        if: ${{ matrix.platform == 'windows' }}
        run: flutter build windows --debug --no-pub
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}
