name: Harness Verification

on:
  push:
    branches: [main, dev, stage]
  pull_request:
    branches: [main, dev, stage]

permissions:
  contents: read

jobs:
  verify-harness:
    name: Verify agent instructions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify root instructions
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          lines=$(wc -l < AGENTS.md)
          if [ "$lines" -gt 150 ]; then
            echo "::error file=AGENTS.md::Root instructions exceed 150 lines ($lines)."
            exit 1
          fi
          test -f docs/ARCHITECTURE.md

      - name: Verify scoped instructions and Claude links
        shell: bash
        run: |
          set -euo pipefail
          for scope in apps/auravibes_app packages/auravibes_engine packages/auravibes_ui widgetbook; do
            test -f "$scope/AGENTS.md"
            test -L "$scope/CLAUDE.md"
            [ "$(readlink "$scope/CLAUDE.md")" = AGENTS.md ]
          done
          test -L CLAUDE.md
          [ "$(readlink CLAUDE.md)" = AGENTS.md ]

      - name: Verify documented links
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r link; do
            case "$link" in
              http://*|https://*|\#*) continue ;;
            esac
            link="${link%%#*}"
            [ -e "$link" ] || {
              echo "::error file=AGENTS.md::Dead reference: $link"
              exit 1
            }
          done < <(sed -nE 's/.*\]\(([^)]*)\).*/\1/p' AGENTS.md)

      - name: Verify project-local Marionette MCP
        shell: bash
        run: |
          set -euo pipefail
          forbidden_command="$(printf '%s %s %s %s %s' dart pub global run 'marionette_mcp')"
          if git grep -n -F -- "$forbidden_command" -- .; then
            echo '::error::Marionette MCP must not use the global Dart executable.'
            exit 1
          fi

          jq -e '.mcpServers.marionette.command == "fvm" and .mcpServers.marionette.args == ["dart", "run", "marionette_mcp"]' .mcp.json
          jq -e '.mcp.marionette.command == ["fvm", "dart", "run", "marionette_mcp"]' opencode.json
          jq -e '.mcpServers.marionette.command == "fvm" and .mcpServers.marionette.args == ["dart", "run", "marionette_mcp"]' .pi/mcp.json
          grep -Fx 'command = "fvm"' .codex/config.toml
          grep -Fx 'args = ["dart", "run", "marionette_mcp"]' .codex/config.toml

          ruby -ryaml -e '
            root = YAML.load_file("pubspec.yaml")
            app = YAML.load_file("apps/auravibes_app/pubspec.yaml")
            lock = YAML.load_file("pubspec.lock").fetch("packages")
            abort unless root.dig("dev_dependencies", "marionette_mcp") == "0.6.0"
            abort unless app.dig("dependencies", "marionette_flutter") == "0.6.0"
            abort unless lock.dig("marionette_mcp", "version") == "0.6.0"
            abort unless lock.dig("marionette_flutter", "version") == "0.6.0"
          '

      - name: Warn on instruction drift
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^ HEAD)
          if grep -qE '(^|/)pubspec\.yaml$|^\.fvmrc$|^\.github/(workflows|actions)/' <<< "$changed" \
             && ! grep -qE '(^|/)AGENTS\.md$|^\.agents/skills/' <<< "$changed"; then
            echo "::warning::Workspace or CI files changed without an AGENTS.md or skill update."
          fi
