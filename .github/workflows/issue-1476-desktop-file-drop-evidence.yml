name: Desktop file drop review evidence

on:
  push:
    branches: [codex/issue-1476-desktop-file-drop]

permissions:
  contents: read

concurrency:
  group: issue-1476-desktop-file-drop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-capture:
    name: chat composer before change
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BASELINE_SHA: 46065bc5983bc9dc9100696aaa3c98ba66c7c56b
    steps:
      - name: Checkout feature source for the shared capture fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve the revision-independent capture test
        run: |
          cp apps/auravibes_app/test/widgets/ux_validation_layout_test.dart "$RUNNER_TEMP/ux_validation_layout_test.dart"
          cp apps/auravibes_app/test/helpers/ux_capture.dart "$RUNNER_TEMP/ux_capture.dart"
          cp apps/auravibes_app/test/helpers/intro_journey_capture.dart "$RUNNER_TEMP/intro_journey_capture.dart"

      - name: Checkout exact main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BASELINE_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Capture the chat composer before change
        working-directory: apps/auravibes_app
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/desktop-file-drop-before-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/desktop-file-drop-before-config
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-file-drop-before"
          cp "$RUNNER_TEMP/ux_validation_layout_test.dart" test/widgets/ux_validation_layout_test.dart
          cp "$RUNNER_TEMP/ux_capture.dart" test/helpers/ux_capture.dart
          cp "$RUNNER_TEMP/intro_journey_capture.dart" test/helpers/intro_journey_capture.dart
          python3 ../../tool/validation_lease.py --label desktop-file-drop-before-capture -- flutter test test/widgets/ux_validation_layout_test.dart --no-pub --plain-name='captures chat composer desktop file drop states' --dart-define="UX_CAPTURE_DIR=$RUNNER_TEMP/desktop-file-drop-before" --dart-define="UX_SOURCE_FINGERPRINT=$BASELINE_SHA"

      - name: Upload before screenshots and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-file-drop-before-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-file-drop-before/
          if-no-files-found: error
          retention-days: 14

  feature-capture:
    name: chat composer after change
    needs: baseline-capture
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Capture the chat composer after change
        working-directory: apps/auravibes_app
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/desktop-file-drop-after-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/desktop-file-drop-after-config
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-file-drop-after"
          python3 ../../tool/validation_lease.py --label desktop-file-drop-after-capture -- flutter test test/widgets/ux_validation_layout_test.dart --no-pub --plain-name='captures chat composer desktop file drop states' --dart-define="UX_CAPTURE_DIR=$RUNNER_TEMP/desktop-file-drop-after" --dart-define="UX_SOURCE_FINGERPRINT=$GITHUB_SHA"

      - name: Upload after screenshots and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-file-drop-after-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-file-drop-after/
          if-no-files-found: error
          retention-days: 14
