name: Repair Dependency Bot Lockfile

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main, dev, stage]

concurrency:
  group: repair-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    # Keep write access limited to same-repository dependency bot branches.
    # Add trusted bot logins and branch prefixes here when adopting another service.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.user.login == 'renovate[bot]' &&
          startsWith(github.event.pull_request.head.ref, 'renovate/')) ||
        (github.event.pull_request.user.login == 'dependabot[bot]' &&
          startsWith(github.event.pull_request.head.ref, 'dependabot/'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.lockfile.outputs.changed }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🔧 Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action/config@c378498f1d1962d33039c3989411093ef8a17b2c # v3
        id: fvm-config-action

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: 🔗 Create FVM symlink for CI
        run: |
          mkdir -p .fvm
          ln -sfn "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: 🏗️ Melos Bootstrap
        uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5 # v3.8.0
        with:
          run-bootstrap: true

      - name: 💾 Commit lockfile repair
        id: lockfile
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No pubspec.lock changes.'
            exit 0
          fi

          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add pubspec.lock
          git commit -m 'chore: refresh pubspec.lock'
          git push origin "HEAD:$PR_HEAD_REF"

  dispatch-ci:
    needs: repair
    if: ${{ needs.repair.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: ✅ Re-run CI for repaired commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run .github/workflows/ci.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_HEAD_REF"
