name: Issue 1527 formatter output

on:
  push:
    branches: [codex/issue-1527-first-chat]

permissions:
  contents: read

concurrency:
  group: issue-1527-format-output-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-output:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Format the failing CI file
        run: dart format --line-length 80 apps/auravibes_app/test/router/first_chat_handoff_test.dart

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: issue-1527-formatted-output-${{ github.sha }}
          path: apps/auravibes_app/test/router/first_chat_handoff_test.dart
          if-no-files-found: error
          retention-days: 1
