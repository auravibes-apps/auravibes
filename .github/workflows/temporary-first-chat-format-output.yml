name: Temporary first chat format output

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  format-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Format the affected test file
        run: dart format --line-length 80 apps/auravibes_app/test/router/first_chat_handoff_test.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: first-chat-handoff-formatted
          path: apps/auravibes_app/test/router/first_chat_handoff_test.dart
          if-no-files-found: error
          retention-days: 1
