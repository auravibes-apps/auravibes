name: Object gateway
on:
  pull_request:
    branches: [main, dev, stage]
    paths:
      - 'services/object_gateway/**'
      - '.github/workflows/object-gateway.yml'
  push:
    branches: [main, dev, stage]
    paths:
      - 'services/object_gateway/**'
      - '.github/workflows/object-gateway.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gateway-test-only
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/object_gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/object_gateway/go.mod
          cache-dependency-path: services/object_gateway/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
        env:
          GATEWAY_TEST_DATABASE_URL: postgres://postgres:gateway-test-only@localhost:5432/gateway_test?sslmode=disable
