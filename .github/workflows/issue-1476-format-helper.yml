name: Issue 1476 formatter output helper

on:
  push:
    branches: [codex/issue-1476-desktop-file-drop]

permissions:
  contents: read

jobs:
  format-sources:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Format the changed Dart sources
        run: >-
          dart format --line-length 80
          apps/auravibes_app/lib/features/chats/services/local_chat_attachment_service_io.dart
          apps/auravibes_app/lib/features/chats/widgets/chat_input_widget.dart
          apps/auravibes_app/test/features/chats/services/local_chat_attachment_service_io_test.dart
          apps/auravibes_app/test/features/chats/widgets/chat_input_widget_test.dart
          apps/auravibes_app/test/widgets/ux_validation_layout_test.dart

      - name: Upload formatted source files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: issue-1476-formatted-sources-${{ github.sha }}
          path: |
            apps/auravibes_app/lib/features/chats/services/local_chat_attachment_service_io.dart
            apps/auravibes_app/lib/features/chats/widgets/chat_input_widget.dart
            apps/auravibes_app/test/features/chats/services/local_chat_attachment_service_io_test.dart
            apps/auravibes_app/test/features/chats/widgets/chat_input_widget_test.dart
            apps/auravibes_app/test/widgets/ux_validation_layout_test.dart
          if-no-files-found: error
          retention-days: 3
