name: Flutter Test CI

on:
  push:
    branches: [main, dev, stage]
  pull_request:
    branches: [main, dev, stage]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  format:
    name: format
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Check formatting
        run: melos run format:check

      - name: Check import sorting
        run: dart run import_sorter:main --exit-if-changed
      - name: Check workspace benchmark imports
        run: dart run tool/check_benchmark_imports.dart

  analysis:
    name: analysis
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Analyze
        run: melos analyze

      - name: Run DCL analysis
        run: melos run dcl:analyze

      - name: Test CI tools
        run: >-
          dart test
          tool/changed_test_selector_test.dart
          tool/merge_lcov_test.dart
          tool/marionette_run_test.dart
          tool/check_test_credentials_test.dart

      - name: Test Python tools
        run: |
          python3 tool/classify_ci_changes_test.py
          python3 tool/ci_summary_test.py
          python3 tool/sonar_workflow_test.py
          python3 tool/plan_test_shards_test.py
          python3 tool/validation_lease_test.py
          python3 tool/test_server_test.py
          python3 tool/agent_worktree_test.py

      - name: Audit first-party tool schemas
        working-directory: apps/auravibes_app
        run: flutter test test/first_party_tool_schema_audit_test.dart --no-pub

  localization-audit:
    name: localization audit
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Audit localization
        working-directory: apps/auravibes_app
        run: dart run tool/localization_audit.dart

  code-health:
    name: code health
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Check unused files
        run: melos run unused:files --no-select

      - name: Check unused code
        run: melos run unused:code --no-select

      - name: Check unnecessary nullable parameters
        run: melos run unnecessary:nullable --no-select

  integrity:
    name: integrity
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check FVM artifact drift
        run: |
          flutter_version="$(ruby -rjson -e 'puts JSON.parse(File.read(".fvmrc")).fetch("flutter")')"
          vscode_sdk_path="$(ruby -rjson -e 'puts JSON.parse(File.read(".vscode/settings.json")).fetch("dart.flutterSdkPath")')"
          expected_path=".fvm/versions/${flutter_version}"

          if [ "$vscode_sdk_path" != "$expected_path" ]; then
            echo "::error::.vscode/settings.json is out of sync with .fvmrc. Run 'fvm use' and commit tracked changes."
            echo "Expected dart.flutterSdkPath: ${expected_path}"
            echo "Actual dart.flutterSdkPath: ${vscode_sdk_path}"
            exit 1
          fi

      - name: Check DCL analyzer plugin version
        run: |
          plugin_version="$(ruby -ryaml -e 'puts YAML.load_file("analysis_options.yaml").fetch("plugins").fetch("dart_code_linter").fetch("version")')"
          locked_version="$(ruby -ryaml -e 'puts YAML.load_file("pubspec.lock").fetch("packages").fetch("dart_code_linter").fetch("version")')"

          if [ "$plugin_version" != "$locked_version" ]; then
            echo "::error::DCL analyzer plugin version must match pubspec.lock. Expected ${locked_version}; found ${plugin_version}."
            exit 1
          fi

      - uses: ./.github/actions/setup-workspace

      - name: Check dependency artifact drift
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Dependency artifacts are out of date. Run 'fvm dart run melos bootstrap', then commit the resulting changes."
            git status --short --untracked-files=all
            git diff --name-only
            git diff --stat
            exit 1
          fi

      - name: Validate dependencies
        run: dart run dependency_validator

      - name: Generate code
        if: ${{ needs.change.outputs.run_generated_checks == 'true' }}
        run: melos run generate --no-select

      - name: Install matching Serverpod CLI
        if: ${{ needs.change.outputs.run_generated_checks == 'true' }}
        run: |
          version="$(ruby -ryaml -e 'puts YAML.load_file("pubspec.lock").fetch("packages").fetch("serverpod").fetch("version")')"
          dart pub global activate serverpod_cli "$version"

      - name: Generate Serverpod code
        if: ${{ needs.change.outputs.run_generated_checks == 'true' }}
        run: melos run generate:serverpod

      - name: Check generated artifact drift
        if: ${{ needs.change.outputs.run_generated_checks == 'true' }}
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Generated artifacts are out of date. Run 'fvm dart run melos run generate' and 'fvm dart run melos run generate:serverpod', then commit the resulting changes."
            git status --short --untracked-files=all
            git diff --name-only
            git diff --stat
            exit 1
          fi

  change:
    name: change
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
      run_code_checks: ${{ steps.platforms.outputs.run_code_checks }}
      run_server_integration: ${{ steps.platforms.outputs.run_server_integration }}
      run_ci_tool_checks: ${{ steps.platforms.outputs.run_ci_tool_checks }}
      renovate_config_changes: ${{ steps.platforms.outputs.renovate_config_changes }}
      run_ui_goldens: ${{ steps.platforms.outputs.run_ui_goldens }}
      run_generated_checks: ${{ steps.platforms.outputs.run_generated_checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed platforms
        id: platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all_platforms='["android","ios","macos","linux","windows","web"]'
          full_build=false
          run_code_checks=true
          renovate_config_changes=false
          run_ci_tool_checks=false
          run_ui_goldens=false
          run_generated_checks=false
          force_optional_checks=false
          base_sha=''
          head_sha="$GITHUB_SHA"
          changed_files=''
          unknown_range=true
          trap 'status=$?; if ((status == 0)); then printf "%s\n" "$changed_files" | UNKNOWN_RANGE="$unknown_range" python3 tool/ci_summary.py routing --outputs "$GITHUB_OUTPUT"; fi; exit "$status"' EXIT

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha // empty' "$EVENT_PATH")"
              head_sha="$(jq -r '.pull_request.head.sha // empty' "$EVENT_PATH")"
              ;;
            merge_group)
              base_sha="$(jq -r '.merge_group.base_sha // empty' "$EVENT_PATH")"
              head_sha="$(jq -r '.merge_group.head_sha // empty' "$EVENT_PATH")"
              full_build=true
              force_optional_checks=true
              ;;
            push)
              base_sha="$(jq -r '.before // empty' "$EVENT_PATH")"
              ;;
            workflow_dispatch)
              full_build=true
              force_optional_checks=true
              if [[ -n "$head_sha" ]] && \
                git cat-file -e "origin/main^{commit}" 2>/dev/null && \
                git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
                base_sha="$(git merge-base origin/main "$head_sha" 2>/dev/null || true)"
              fi
              ;;
            *)
              full_build=true
              force_optional_checks=true
              ;;
          esac

          if [[ "$base_sha" == "" || "$base_sha" =~ ^0+$ ]]; then
            full_build=true
          elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            full_build=true
          elif [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "merge_group" ]] \
            && ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            full_build=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$head_sha" ]] || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              head_sha=HEAD
            fi
          fi

          if [[ "$base_sha" == "" || "$base_sha" =~ ^0+$ ]] || \
            ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null || \
            [[ "$head_sha" == "" ]] || \
            ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            printf 'platforms=%s\n' "$all_platforms" >> "$GITHUB_OUTPUT"
            printf 'run_code_checks=true\n' >> "$GITHUB_OUTPUT"
            printf 'run_server_integration=true\n' >> "$GITHUB_OUTPUT"
            printf 'run_ci_tool_checks=false\n' >> "$GITHUB_OUTPUT"
            printf 'renovate_config_changes=%s\n' "$renovate_config_changes" >> "$GITHUB_OUTPUT"
            printf 'run_ui_goldens=true\n' >> "$GITHUB_OUTPUT"
            printf 'run_generated_checks=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only --diff-filter=ACDMRTUXB "$base_sha" "$head_sha")"
          unknown_range=false
          classification="$(printf '%s\n' "$changed_files" | python3 tool/classify_ci_changes.py --base "$base_sha" --head "$head_sha")"
          run_code_checks="$(jq -r '.run_code_checks' <<< "$classification")"
          run_server_integration="$(jq -r '.run_server_integration' <<< "$classification")"
          run_ci_tool_checks="$(jq -r '.run_ci_tool_checks' <<< "$classification")"
          renovate_config_changes="$(jq -r '.renovate_config_changes' <<< "$classification")"
          run_ui_goldens="$(jq -r '.run_ui_goldens' <<< "$classification")"
          run_generated_checks="$(jq -r '.run_generated_checks' <<< "$classification")"
          platforms=()

          if [[ "$full_build" == true ]]; then
            if [[ "$force_optional_checks" == true ]]; then
              run_ui_goldens=true
              run_generated_checks=true
            fi
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              run_server_integration=true
            fi
            printf 'platforms=%s\n' "$all_platforms" >> "$GITHUB_OUTPUT"
            printf 'run_code_checks=true\n' >> "$GITHUB_OUTPUT"
            printf 'run_server_integration=%s\n' "$run_server_integration" >> "$GITHUB_OUTPUT"
            printf 'run_ci_tool_checks=%s\n' "$run_ci_tool_checks" >> "$GITHUB_OUTPUT"
            printf 'renovate_config_changes=%s\n' "$renovate_config_changes" >> "$GITHUB_OUTPUT"
            printf 'run_ui_goldens=%s\n' "$run_ui_goldens" >> "$GITHUB_OUTPUT"
            printf 'run_generated_checks=%s\n' "$run_generated_checks" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          add_platform() {
            local platform="$1"
            for existing in "${platforms[@]}"; do
              [[ "$existing" == "$platform" ]] && return
            done
            platforms+=("$platform")
          }

          while IFS= read -r path; do
            case "$path" in
              apps/auravibes_app/android/*) add_platform android ;;
              apps/auravibes_app/ios/*) add_platform ios ;;
              apps/auravibes_app/macos/*) add_platform macos ;;
              apps/auravibes_app/linux/*) add_platform linux ;;
              apps/auravibes_app/windows/*) add_platform windows ;;
              apps/auravibes_app/web/*) add_platform web ;;
              apps/auravibes_app/lib/*|apps/auravibes_app/assets/*|packages/*/lib/*|packages/*/assets/*) full_build=true ;;
              apps/auravibes_app/pubspec.yaml|apps/auravibes_app/pubspec.lock|apps/auravibes_app/pubspec_overrides.yaml) full_build=true ;;
              packages/*/pubspec.yaml|packages/*/pubspec.lock|packages/*/pubspec_overrides.yaml) full_build=true ;;
              pubspec.yaml|pubspec.lock|pubspec_overrides.yaml|melos.yaml) full_build=true ;;
              .fvmrc|.fvm/*|.vscode/settings.json) full_build=true ;;
              .github/workflows/build-matrix.yml|.github/actions/*) full_build=true ;;
            esac
            [[ "$full_build" == true ]] && break
          done <<< "$changed_files"

          if [[ "$full_build" == true ]]; then
            run_code_checks=true
            printf 'platforms=%s\n' "$all_platforms" >> "$GITHUB_OUTPUT"
          elif ((${#platforms[@]} == 0)); then
            printf 'platforms=[]\n' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${platforms[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))' | sed 's/^/platforms=/' >> "$GITHUB_OUTPUT"
          fi
          printf 'run_code_checks=%s\n' "$run_code_checks" >> "$GITHUB_OUTPUT"
          printf 'run_server_integration=%s\n' "$run_server_integration" >> "$GITHUB_OUTPUT"
          printf 'run_ci_tool_checks=%s\n' "$run_ci_tool_checks" >> "$GITHUB_OUTPUT"
          printf 'renovate_config_changes=%s\n' "$renovate_config_changes" >> "$GITHUB_OUTPUT"
          printf 'run_ui_goldens=%s\n' "$run_ui_goldens" >> "$GITHUB_OUTPUT"
          printf 'run_generated_checks=%s\n' "$run_generated_checks" >> "$GITHUB_OUTPUT"

  renovate-validation:
    name: validate Renovate configuration
    needs: change
    if: ${{ needs.change.outputs.renovate_config_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.149.0 -- renovate-config-validator --strict
        # This checks configuration syntax and supported options. It does not
        # run dependency lookups or prove that package names resolve.

  ci-routing-tests:
    name: CI routing tests
    needs: change
    if: >-
      ${{
        needs.change.outputs.run_ci_tool_checks == 'true' &&
        needs.change.outputs.run_code_checks != 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test CI routing
        run: |
          python3 tool/classify_ci_changes_test.py
          python3 tool/ci_summary_test.py

  platform-builds:
    name: platform builds
    needs: change
    if: ${{ needs.change.outputs.platforms != '[]' }}
    uses: ./.github/workflows/build-matrix.yml
    with:
      platforms: ${{ needs.change.outputs.platforms }}


  test-plan:
    name: test plan
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      coverage-report-count: ${{ steps.plan.outputs.coverage-report-count }}
      reason: ${{ steps.plan.outputs.reason }}
      timing-source: ${{ steps.plan.outputs.timing-source }}
      artifact-url: ${{ steps.upload-test-plan.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Determine test plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan_dir="$RUNNER_TEMP/test-plan"
          manifest="$plan_dir/changed-tests.json"
          matrix_file="$plan_dir/matrix.json"
          timing_source_file="$plan_dir/timing-source.txt"
          rm -rf "$plan_dir"
          mkdir -p "$plan_dir"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! dart tool/changed_test_selector.dart select \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head HEAD \
              --output "$manifest"; then
              printf '%s\n' '{"mode":"full","packages":{},"reason":"selector failed"}' > "$manifest"
            fi
          else
            printf '%s\n' '{"mode":"full","packages":{},"reason":"non-PR run"}' > "$manifest"
          fi

          mode="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("mode")' "$manifest")"
          reason="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("reason")' "$manifest")"
          bash tool/plan_test_shards.sh "$manifest" "$plan_dir"
          matrix="$(cat "$matrix_file")"
          report_count="$(ruby -rjson -e 'puts JSON.parse(ARGF.read).fetch("include").length' <<< "$matrix")"
          timing_source="$(cat "$timing_source_file")"

          {
            echo "mode=$mode"
            echo "reason=$reason"
            echo "timing-source=$timing_source"
            echo "matrix=$matrix"
            echo "coverage-report-count=$report_count"
          } >> "$GITHUB_OUTPUT"

      - name: Upload test plan
        id: upload-test-plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-plan
          path: ${{ runner.temp }}/test-plan
          if-no-files-found: error

      - name: Summarize test plan
        env:
          ARTIFACT_URL: ${{ steps.upload-test-plan.outputs.artifact-url }}
        run: python3 tool/ci_summary.py plan --plan-dir "$RUNNER_TEMP/test-plan"

  test:
    name: test (${{ matrix.package }} shard ${{ matrix.shardIndex }})
    needs: [test-plan]
    if: ${{ needs.test-plan.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Download test plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-plan
          path: ${{ runner.temp }}/test-plan

      - name: Run selected tests
        id: run-tests
        shell: bash
        env:
          MATRIX_PATHS: ${{ toJSON(matrix.paths) }}
          MATRIX_PACKAGE: ${{ matrix.package }}
          MATRIX_SHARD_MODE: ${{ matrix.shardMode }}
          MATRIX_SHARD_INDEX: ${{ matrix.shardIndex }}
          MATRIX_TOTAL_SHARDS: ${{ matrix.totalShards }}
          TEST_MODE: ${{ needs.test-plan.outputs.mode }}
          TEST_REASON: ${{ needs.test-plan.outputs.reason }}
          TIMING_SOURCE: ${{ needs.test-plan.outputs.timing-source }}
        run: |
          coverage=()
          shards=()
          paths=()
          timings=(--timings-dir "$RUNNER_TEMP/test-timings")
          mkdir -p "$RUNNER_TEMP/test-timings"
          if [ "$TEST_MODE" != "none" ]; then
            coverage=(--coverage)
          fi
          if [ "$MATRIX_SHARD_MODE" = "timed" ]; then
            paths_file="$RUNNER_TEMP/test-paths.json"
            printf '%s\n' "$MATRIX_PATHS" > "$paths_file"
            paths=(--paths-file "$paths_file")
          else
            shards=(
              --total-shards "$MATRIX_TOTAL_SHARDS"
              --shard-index "$MATRIX_SHARD_INDEX"
            )
          fi
          selector_args=(
            run
            --manifest "$RUNNER_TEMP/test-plan/changed-tests.json"
            --package "$MATRIX_PACKAGE"
            "${shards[@]}"
            "${coverage[@]}"
            "${paths[@]}"
            "${timings[@]}"
          )
          command_file="$RUNNER_TEMP/test-timings/test-command.txt"
          dart run tool/changed_test_selector.dart "${selector_args[@]}" --dry-run > "$command_file"
          python3 tool/ci_summary.py replay --report-dir "$RUNNER_TEMP/test-timings"
          cp -r "$RUNNER_TEMP/test-plan" "$RUNNER_TEMP/test-timings/test-plan"
          status=0
          if dart run tool/changed_test_selector.dart "${selector_args[@]}"; then
            status=0
          else
            status=$?
          fi
          echo "command_completed=true" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload Widgetbook golden failures
        id: upload-widgetbook-golden-failures
        if: ${{ failure() && matrix.package == 'widgetbook' && steps.run-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: widgetbook-golden-failures-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact }}
          # LocalFileComparator writes beside the test, not the golden baseline.
          path: widgetbook/test/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize Widgetbook golden failures
        if: ${{ always() && matrix.package == 'widgetbook' && steps.run-tests.outcome == 'failure' }}
        env:
          ARTIFACT_URL: ${{ steps.upload-widgetbook-golden-failures.outputs.artifact-url }}
          ARTIFACT_NAME: widgetbook-golden-failures-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact }}
        run: |
          if [[ -n "$ARTIFACT_URL" ]]; then
            printf 'Widgetbook golden failure artifact: [%s](%s)\n' "$ARTIFACT_NAME" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No artifact was produced for Widgetbook golden failures (%s).\n' "$ARTIFACT_NAME" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shard test report
        id: upload-test-report
        if: ${{ !cancelled() && steps.run-tests.outputs.command_completed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-report-${{ matrix.artifact }}
          path: ${{ runner.temp }}/test-timings
          if-no-files-found: ignore

      - name: Summarize test shard
        if: ${{ !cancelled() && steps.run-tests.outputs.command_completed == 'true' }}
        env:
          MATRIX_ROW: ${{ toJSON(matrix) }}
          TEST_OUTCOME: ${{ steps.run-tests.outcome }}
          ARTIFACT_URL: ${{ steps.upload-test-report.outputs.artifact-url }}
          PLAN_ARTIFACT_URL: ${{ needs.test-plan.outputs.artifact-url }}
        run: |
          python3 tool/ci_summary.py shard \
            --plan-dir "$RUNNER_TEMP/test-plan" \
            --report-dir "$RUNNER_TEMP/test-timings"

      - name: Upload shard timing
        if: ${{ success() && needs.test-plan.outputs.mode == 'full' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-timing-${{ matrix.artifact }}
          path: ${{ runner.temp }}/test-timings/*.json
          if-no-files-found: ignore

      - name: Prepare coverage artifact
        if: ${{ success() && needs.test-plan.outputs.mode != 'none' }}
        shell: bash
        run: |
          output="$RUNNER_TEMP/coverage/${{ matrix.artifact }}"
          mkdir -p "$output"
          cp "${{ matrix.package }}/coverage/lcov.info" "$output/lcov.info"
          printf '%s\n' "${{ matrix.package }}" > "$output/package-root"

      - name: Upload coverage artifact
        if: ${{ success() && needs.test-plan.outputs.mode != 'none' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.artifact }}
          path: ${{ runner.temp }}/coverage/${{ matrix.artifact }}
          if-no-files-found: error

  responsive-shell-goldens:
    name: responsive shell goldens
    needs: change
    if: ${{ needs.change.outputs.run_ui_goldens == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Run app UI goldens
        id: app-golden-test
        working-directory: apps/auravibes_app
        run: flutter test --no-pub --tags=golden

      - name: Run shared UI goldens
        id: shared-ui-golden-test
        working-directory: packages/auravibes_ui
        run: flutter test --no-pub --tags=golden

      - name: Upload UI golden failures
        id: upload-golden-failures
        if: ${{ failure() && (steps.app-golden-test.outcome == 'failure' || steps.shared-ui-golden-test.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-golden-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/auravibes_app/test/**/failures/*.png
            packages/auravibes_ui/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize UI golden failures
        if: ${{ always() && (steps.app-golden-test.outcome == 'failure' || steps.shared-ui-golden-test.outcome == 'failure') }}
        env:
          ARTIFACT_URL: ${{ steps.upload-golden-failures.outputs.artifact-url }}
          ARTIFACT_NAME: ui-golden-failures-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ -n "$ARTIFACT_URL" ]]; then
            printf 'UI golden failure artifact: [%s](%s)\n' "$ARTIFACT_NAME" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No artifact was produced for UI golden failures (%s).\n' "$ARTIFACT_NAME" >> "$GITHUB_STEP_SUMMARY"
          fi

  test-timings:
    name: test timings
    needs: [test-plan, test]
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        needs.test-plan.outputs.mode == 'full' &&
        needs.test.result == 'success'
      }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Download shard timings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: test-timing-*
          path: ${{ runner.temp }}/test-timings
          merge-multiple: false

      - name: Merge test timings
        run: |
          dart run tool/changed_test_selector.dart merge-timings \
            --input-root "$RUNNER_TEMP/test-timings" \
            --output "$RUNNER_TEMP/test_timings.json" \
            --source-sha "${{ github.sha }}"

      - name: Upload historical test timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-timings
          path: ${{ runner.temp }}/test_timings.json
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: coverage and Sonar
    needs: [format, analysis, code-health, integrity, test-plan, test]
    if: >-
      ${{
        always() &&
        needs.format.result == 'success' &&
        needs.analysis.result == 'success' &&
        needs.code-health.result == 'success' &&
        needs.integrity.result == 'success' &&
        needs.test-plan.outputs.mode != 'none' &&
        needs.test.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage-artifacts
          merge-multiple: false

      - name: Merge LCOV reports for Sonar
        run: |
          dart run tool/merge_lcov.dart \
            --input-root "$RUNNER_TEMP/coverage-artifacts" \
            --output coverage/lcov.info \
            --expected-reports "${{ needs.test-plan.outputs.coverage-report-count }}"

      - name: Check Sonar token availability
        if: >-
          ${{ github.event_name == 'push' ||
              (github.event_name == 'pull_request' &&
               github.event.pull_request.head.repo.full_name == github.repository) }}
        id: check-sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "SONAR_TOKEN is required for same-repository pull requests." >&2
            exit 1
          else
            echo "token_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java for SonarCloud
        if: ${{ steps.check-sonar-token.outputs.token_available == 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: SonarCloud Scan
        if: ${{ steps.check-sonar-token.outputs.token_available == 'true' }}
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.scanner.skipJreProvisioning=true

  sonar-without-coverage:
    name: SonarCloud scan without coverage
    needs: [change, test-plan, coverage]
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.coverage.result == 'skipped' &&
        (needs.change.outputs.run_code_checks == 'false' ||
         needs.test-plan.outputs.mode == 'none')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is required for same-repository pull requests." >&2
            exit 1
          fi

      - name: Set up Java for SonarCloud
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.scanner.skipJreProvisioning=true

  server-compose:
    name: server-compose / Docker smoke
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          zero_sha=0000000000000000000000000000000000000000
          base=''
          head="$WORKFLOW_SHA"
          relevant=true
          launcher_scripts=false
          range_known=false
          reason='missing or unknown commit range'
          dockerfiles=()

          is_dockerfile_path() {
            case "$1" in
              Dockerfile*|*/Dockerfile*|*.Dockerfile|*/*.Dockerfile)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_docker_related_path() {
            case "$1" in
              .github/workflows/ci.yml|\
              .dockerignore|*/.dockerignore|\
              Dockerfile*|*/Dockerfile*|*.Dockerfile|*/*.Dockerfile|\
              compose*.yml|compose*.yaml|*/compose*.yml|*/compose*.yaml|\
              docker-compose*.yml|docker-compose*.yaml|*/docker-compose*.yml|*/docker-compose*.yaml|\
              scripts/start_server.sh|scripts/stop_server.sh|scripts/serverpod_worktree_env.sh)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          add_dockerfile() {
            local dockerfile="$1"
            local existing
            for existing in "${dockerfiles[@]}"; do
              if [ "$existing" = "$dockerfile" ]; then
                return 0
              fi
            done
            dockerfiles+=("$dockerfile")
          }

          inspect_path() {
            local path="$1"
            if is_docker_related_path "$path"; then
              relevant=true
            fi
            if is_dockerfile_path "$path"; then
              add_dockerfile "$path"
            fi
            case "$path" in
              .dockerignore|*/.dockerignore)
                if [ -f apps/auravibes_server/Dockerfile ]; then
                  add_dockerfile apps/auravibes_server/Dockerfile
                fi
                ;;
              scripts/start_server.sh|scripts/stop_server.sh|scripts/serverpod_worktree_env.sh)
                launcher_scripts=true
                ;;
            esac
          }

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$BEFORE_SHA"
              ;;
            workflow_dispatch)
              if git cat-file -e 'origin/main^{commit}' 2>/dev/null; then
                base="$(git merge-base origin/main "$head")"
              fi
              ;;
          esac

          if [ -n "$head" ] && git cat-file -e "$head^{commit}" 2>/dev/null; then
            if [ -n "$base" ] && [ "$base" != "$zero_sha" ] \
              && git cat-file -e "$base^{commit}" 2>/dev/null; then
              relevant=false
              reason="diff $base..$head"
              if changed_paths="$(git diff --name-only --no-renames "$base" "$head")"; then
                range_known=true
                while IFS= read -r path; do
                  inspect_path "$path"
                done <<< "$changed_paths"
              else
                relevant=true
                reason='unable to diff commit range'
              fi
            else
              reason='missing or initial base SHA'
            fi
          fi

          if [ "$range_known" = false ]; then
            launcher_scripts=true
            if [ -f apps/auravibes_server/Dockerfile ]; then
              add_dockerfile apps/auravibes_server/Dockerfile
            fi
          fi

          {
            printf 'relevant=%s\n' "$relevant"
            printf 'launcher_scripts=%s\n' "$launcher_scripts"
            printf 'reason=%s\n' "$reason"
            printf 'dockerfiles<<DOCKERFILES\n'
            if ((${#dockerfiles[@]} > 0)); then
              printf '%s\n' "${dockerfiles[@]}"
            fi
            printf 'DOCKERFILES\n'
          } >> "$GITHUB_OUTPUT"
          printf 'Relevant Docker changes: %s (%s)\n' "$relevant" "$reason"

      - name: Validate changed Dockerfiles
        if: ${{ steps.changes.outputs.dockerfiles != '' }}
        shell: bash
        env:
          DOCKERFILES: ${{ steps.changes.outputs.dockerfiles }}
        run: |
          set -euo pipefail
          while IFS= read -r dockerfile; do
            [ -n "$dockerfile" ] || continue
            if [ ! -f "$dockerfile" ]; then
              echo "Skipping removed Dockerfile: $dockerfile"
              continue
            fi
            docker build --check --file "$dockerfile" .
          done <<< "$DOCKERFILES"

      - name: Validate Docker launcher scripts
        if: ${{ steps.changes.outputs.launcher_scripts == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/start_server.sh scripts/stop_server.sh scripts/serverpod_worktree_env.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
            fi
          done

      - name: Validate Compose configuration
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        working-directory: apps/auravibes_server
        run: docker compose config --quiet

      - name: Pull Redis images
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        working-directory: apps/auravibes_server
        run: docker compose pull redis redis_test

      - name: Start Redis services
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        working-directory: apps/auravibes_server
        run: docker compose up -d --remove-orphans redis redis_test

      - name: Smoke-test Redis commands
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        working-directory: apps/auravibes_server
        shell: bash
        env:
          REDIS_PASSWORD: UWl-mNHNEUXv_xe0CWFzHBajGK1UV0B1
          REDIS_TEST_PASSWORD: GZZj4HpiGxQK0g_kBQ3qWQMstI9y-Kze
        run: |
          set -euo pipefail

          wait_for_redis() {
            local service="$1"
            local password="$2"
            local response

            for _ in {1..30}; do
              if response="$(docker compose exec -T -e REDISCLI_AUTH="$password" "$service" redis-cli --raw ping 2>/dev/null | tr -d '\r')" \
                && [ "$response" = 'PONG' ]; then
                docker compose exec -T "$service" redis-cli -v
                if [ "$(docker compose exec -T -e REDISCLI_AUTH="$password" "$service" redis-cli --raw set ci-smoke ok | tr -d '\r')" = 'OK' ] \
                  && [ "$(docker compose exec -T -e REDISCLI_AUTH="$password" "$service" redis-cli --raw get ci-smoke | tr -d '\r')" = 'ok' ]; then
                  return 0
                fi
              fi
              sleep 1
            done

            docker compose logs "$service"
            return 1
          }

          wait_for_redis redis "$REDIS_PASSWORD"
          wait_for_redis redis_test "$REDIS_TEST_PASSWORD"

      - name: Stop Redis services
        if: ${{ always() && steps.changes.outputs.relevant == 'true' }}
        working-directory: apps/auravibes_server
        run: docker compose down -v --remove-orphans

  server-integration:
    name: server integration tests
    needs: change
    if: ${{ needs.change.outputs.run_server_integration == 'true' }}
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Configure disposable test database credentials
        working-directory: apps/auravibes_server
        shell: bash
        run: |
          set -euo pipefail
          awk -v database_password="$POSTGRES_PASSWORD" '
            /^test:$/ { in_test = 1; print; next }
            /^[^[:space:]]/ { in_test = 0 }
            in_test && /^  database:/ {
              printf "  database: \"%s\"\n", database_password
              replaced = 1
              next
            }
            { print }
            END { if (!replaced) exit 1 }
          ' config/passwords.example.yaml > config/passwords.yaml

      - name: Start PostgreSQL test service
        working-directory: apps/auravibes_server
        run: docker compose up -d --remove-orphans postgres_test

      - name: Wait for PostgreSQL
        working-directory: apps/auravibes_server
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..60}; do
            if docker compose exec -T postgres_test pg_isready \
              -U postgres -d auravibes_server_test; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs postgres_test
          exit 1

      - name: Run Serverpod integration suite
        working-directory: apps/auravibes_server
        run: dart test test/integration --reporter=compact

      - name: Stop PostgreSQL test service
        if: ${{ always() }}
        working-directory: apps/auravibes_server
        run: docker compose down -v --remove-orphans

  ci-success:
    name: ci success
    if: ${{ always() }}
    needs: [change, format, analysis, localization-audit, code-health, integrity, test-plan, test, responsive-shell-goldens, coverage, sonar-without-coverage, platform-builds, server-compose, server-integration, renovate-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Fail for failed required checks
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: Confirm required checks
        run: echo 'All required CI checks passed or were intentionally skipped.'
