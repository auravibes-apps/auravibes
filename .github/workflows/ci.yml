name: Flutter Test CI

on:
  push:
    branches: [main, dev, stage]
  pull_request:
    branches: [main, dev, stage]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Check FVM artifact drift
        run: |
          flutter_version="$(ruby -rjson -e 'puts JSON.parse(File.read(".fvmrc")).fetch("flutter")')"
          vscode_sdk_path="$(ruby -rjson -e 'puts JSON.parse(File.read(".vscode/settings.json")).fetch("dart.flutterSdkPath")')"
          expected_path=".fvm/versions/${flutter_version}"

          if [ "$vscode_sdk_path" != "$expected_path" ]; then
            echo "::error::.vscode/settings.json is out of sync with .fvmrc. Run 'fvm use' and commit tracked changes."
            echo "Expected dart.flutterSdkPath: ${expected_path}"
            echo "Actual dart.flutterSdkPath: ${vscode_sdk_path}"
            exit 1
          fi

      - name: 🔧 Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action/config@c378498f1d1962d33039c3989411093ef8a17b2c # v3
        id: fvm-config-action

      - name: 🔍 Detect Flutter channel
        id: channel-detect
        run: |
          version="${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}"
          if echo "$version" | grep -qE '\.pre$|\.dev\.|-beta\.'; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.channel-detect.outputs.channel }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🔗 Create FVM symlink for CI
        run: |
          mkdir -p .fvm
          ln -sfn "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: 📦 Bootstrap workspace
        uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5
        with:
          run-bootstrap: true

      - name: 📦 Check dependency artifact drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Dependency artifacts are out of date. Run 'fvm dart run melos bootstrap', then commit the resulting changes."
            git diff --name-only
            git diff --stat
            git diff --exit-code
          fi

      - name: ✨ Check Formatting
        run: melos run format:check

      - name: 🕵️‍♂️ Analyze
        run: melos analyze

      - name: 🗑️ Check unused files
        run: melos run unused:files --no-select

      - name: 🗑️ Check unused code
        run: melos run unused:code --no-select

      - name: 🧹 Check unnecessary nullable parameters
        run: melos run unnecessary:nullable --no-select

      - name: 📦 Dependency Validation
        run: dart run dependency_validator

      - name: 📝 Import Sorting
        run: dart run import_sorter:main --exit-if-changed

      - name: 🛠️ Generate Code
        run: melos run generate --no-select

      - name: 📦 Check generated artifact drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated artifacts are out of date. Run 'fvm dart run melos run generate', then commit the resulting changes."
            git diff --name-only
            git diff --stat
            git diff --exit-code
          fi

      - name: 🧭 Determine test scope
        id: test-scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | \
            grep -qE '^(\.github/|\.fvmrc$|analysis_options\.yaml$|dart_dependency_validator\.yaml$|pubspec\.yaml$|pubspec\.lock$)'; then
            echo 'run_all=true' >> "$GITHUB_OUTPUT"
            echo 'run_tests=true' >> "$GITHUB_OUTPUT"
          elif melos list --diff="${{ github.event.pull_request.base.sha }}...HEAD" \
            --include-dependents --dir-exists=test --parsable | grep -q .; then
            echo 'run_all=false' >> "$GITHUB_OUTPUT"
            echo 'run_tests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_all=false' >> "$GITHUB_OUTPUT"
            echo 'run_tests=false' >> "$GITHUB_OUTPUT"
          fi

      - name: 🧪 Run affected tests with coverage
        if: github.event_name == 'pull_request' && steps.test-scope.outputs.run_all != 'true' && steps.test-scope.outputs.run_tests == 'true'
        run: >-
          melos run test:ci
          --diff="${{ github.event.pull_request.base.sha }}...HEAD"
          --include-dependents
          --no-select

      - name: 🧪 No affected tests
        if: github.event_name == 'pull_request' && steps.test-scope.outputs.run_tests == 'false'
        run: echo 'No workspace package tests are affected by this pull request.'

      - name: 🧪 Run all tests with coverage
        if: github.event_name != 'pull_request' || steps.test-scope.outputs.run_all == 'true'
        run: melos run test:ci --no-select

      - name: 🧭 Merge LCOV reports for Sonar
        run: |
          ruby <<'RUBY'
          package_dirs = Dir.glob('{apps,packages,widgetbook}/*')
            .select { |path| File.directory?(File.join(path, 'test')) }
          abort 'No tested workspace packages found' if package_dirs.empty?

          reports = package_dirs.filter_map do |package_dir|
            report = File.join(package_dir, 'coverage/lcov.info')
            [package_dir, report] if File.file?(report)
          end

          merged = reports.flat_map do |package_dir, report|
            records = File.read(report).split("end_of_record\n")
            records.filter_map do |record|
              lines = record.lines(chomp: true)
              sf_index = lines.index { |line| line.start_with?('SF:') }
              next if sf_index.nil?

              path = lines[sf_index].delete_prefix('SF:')
              path = path.delete_prefix("#{Dir.pwd}/")
              path = File.join(package_dir, path) if path.start_with?('lib/')
              excluded = path.end_with?('.g.dart', '.freezed.dart', '.mocks.dart') ||
                path.end_with?('/drift_worker.js') ||
                path.start_with?('apps/auravibes_server/lib/src/generated/')
              next if excluded
              abort "Non-repository coverage path: #{path}" if path.start_with?('/')

              lines[sf_index] = "SF:#{path}"
              "#{lines.join("\n")}\nend_of_record\n"
            end
          end

          Dir.mkdir('coverage') unless Dir.exist?('coverage')
          File.write('coverage/lcov.info', merged.join)
          RUBY

      - name: 🔐 Check Sonar token availability
        id: check-sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ☁️ SonarCloud Scan
        if: ${{ steps.check-sonar-token.outputs.token_available == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.scanner.skipJreProvisioning=true
