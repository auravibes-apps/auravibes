name: Flutter Test CI

on:
  push:
    branches: [main, dev, stage]
  pull_request:
    branches: [main, dev, stage]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Check formatting
        run: melos run format:check

      - name: Check import sorting
        run: dart run import_sorter:main --exit-if-changed

  analysis:
    name: analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Analyze
        run: melos analyze

      - name: Test CI tools
        run: dart test tool/changed_test_selector_test.dart tool/merge_lcov_test.dart

  code-health:
    name: code health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Check unused files
        run: melos run unused:files --no-select

      - name: Check unused code
        run: melos run unused:code --no-select

      - name: Check unnecessary nullable parameters
        run: melos run unnecessary:nullable --no-select

  integrity:
    name: integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check FVM artifact drift
        run: |
          flutter_version="$(ruby -rjson -e 'puts JSON.parse(File.read(".fvmrc")).fetch("flutter")')"
          vscode_sdk_path="$(ruby -rjson -e 'puts JSON.parse(File.read(".vscode/settings.json")).fetch("dart.flutterSdkPath")')"
          expected_path=".fvm/versions/${flutter_version}"

          if [ "$vscode_sdk_path" != "$expected_path" ]; then
            echo "::error::.vscode/settings.json is out of sync with .fvmrc. Run 'fvm use' and commit tracked changes."
            echo "Expected dart.flutterSdkPath: ${expected_path}"
            echo "Actual dart.flutterSdkPath: ${vscode_sdk_path}"
            exit 1
          fi

      - uses: ./.github/actions/setup-workspace

      - name: Check dependency artifact drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Dependency artifacts are out of date. Run 'fvm dart run melos bootstrap', then commit the resulting changes."
            git diff --name-only
            git diff --stat
            git diff --exit-code
          fi

      - name: Validate dependencies
        run: dart run dependency_validator

      - name: Generate code
        run: melos run generate --no-select

      - name: Install matching Serverpod CLI
        run: |
          version="$(ruby -ryaml -e 'puts YAML.load_file("pubspec.lock").fetch("packages").fetch("serverpod").fetch("version")')"
          dart pub global activate serverpod_cli "$version"

      - name: Generate Serverpod code
        run: melos run generate:serverpod

      - name: Check generated artifact drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated artifacts are out of date. Run 'fvm dart run melos run generate' and 'fvm dart run melos run generate:serverpod', then commit the resulting changes."
            git diff --name-only
            git diff --stat
            git diff --exit-code
          fi

  change:
    name: change
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed platforms
        id: platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all_platforms='["android","ios","macos","linux","windows","web"]'
          full_build=false
          base_sha=''
          head_sha="$GITHUB_SHA"

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha // empty' "$EVENT_PATH")"
              head_sha="$(jq -r '.pull_request.head.sha // empty' "$EVENT_PATH")"
              ;;
            push)
              base_sha="$(jq -r '.before // empty' "$EVENT_PATH")"
              ;;
            workflow_dispatch)
              full_build=true
              ;;
            *)
              full_build=true
              ;;
          esac

          if [[ "$base_sha" == "" || "$base_sha" =~ ^0+$ ]]; then
            full_build=true
          elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            full_build=true
          elif [[ "$EVENT_NAME" == "push" ]] && ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            full_build=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$head_sha" ]] || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              head_sha=HEAD
            fi
          fi

          if [[ "$full_build" == true ]]; then
            printf 'platforms=%s\n' "$all_platforms" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only --diff-filter=ACDMRTUXB "$base_sha" "$head_sha")"
          platforms=()

          add_platform() {
            local platform="$1"
            for existing in "${platforms[@]}"; do
              [[ "$existing" == "$platform" ]] && return
            done
            platforms+=("$platform")
          }

          while IFS= read -r path; do
            case "$path" in
              apps/auravibes_app/android/*) add_platform android ;;
              apps/auravibes_app/ios/*) add_platform ios ;;
              apps/auravibes_app/macos/*) add_platform macos ;;
              apps/auravibes_app/linux/*) add_platform linux ;;
              apps/auravibes_app/windows/*) add_platform windows ;;
              apps/auravibes_app/web/*) add_platform web ;;
              apps/auravibes_app/lib/*|apps/auravibes_app/assets/*|packages/*/lib/*|packages/*/assets/*) full_build=true ;;
              apps/auravibes_app/pubspec.yaml|apps/auravibes_app/pubspec.lock|apps/auravibes_app/pubspec_overrides.yaml) full_build=true ;;
              packages/*/pubspec.yaml|packages/*/pubspec.lock|packages/*/pubspec_overrides.yaml) full_build=true ;;
              pubspec.yaml|pubspec.lock|pubspec_overrides.yaml|melos.yaml) full_build=true ;;
              .fvmrc|.fvm/*|.vscode/settings.json) full_build=true ;;
              .github/workflows/ci.yml|.github/workflows/build-matrix.yml|.github/actions/*) full_build=true ;;
            esac
            [[ "$full_build" == true ]] && break
          done <<< "$changed_files"

          if [[ "$full_build" == true ]]; then
            printf 'platforms=%s\n' "$all_platforms" >> "$GITHUB_OUTPUT"
          elif ((${#platforms[@]} == 0)); then
            printf 'platforms=[]\n' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${platforms[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))' | sed 's/^/platforms=/' >> "$GITHUB_OUTPUT"
          fi

  platform-builds:
    name: platform builds
    needs: change
    if: ${{ needs.change.outputs.platforms != '[]' }}
    uses: ./.github/workflows/build-matrix.yml
    with:
      platforms: ${{ needs.change.outputs.platforms }}


  test-plan:
    name: test plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      coverage-report-count: ${{ steps.plan.outputs.coverage-report-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Determine test plan
        id: plan
        shell: bash
        run: |
          manifest="$RUNNER_TEMP/changed-tests.json"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! dart run tool/changed_test_selector.dart select \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head HEAD \
              --output "$manifest"; then
              printf '%s\n' '{"mode":"full","packages":{},"reason":"selector failed"}' > "$manifest"
            fi
          else
            printf '%s\n' '{"mode":"full","packages":{},"reason":"non-PR run"}' > "$manifest"
          fi

          mode="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("mode")' "$manifest")"
          matrix="$(dart run tool/changed_test_selector.dart matrix \
            --manifest "$manifest" \
            --shard-package apps/auravibes_app \
            --shard-count 3)"
          report_count="$(ruby -rjson -e 'puts JSON.parse(ARGF.read).fetch("include").length' <<< "$matrix")"

          {
            echo "mode=$mode"
            echo "matrix=$matrix"
            echo "coverage-report-count=$report_count"
          } >> "$GITHUB_OUTPUT"

      - name: Upload test plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-plan
          path: ${{ runner.temp }}/changed-tests.json
          if-no-files-found: error

  test:
    name: test (${{ matrix.package }} shard ${{ matrix.shardIndex }})
    needs: [integrity, test-plan]
    if: ${{ needs.test-plan.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Download test plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-plan
          path: ${{ runner.temp }}/test-plan

      - name: Run selected tests
        shell: bash
        run: |
          coverage=()
          if [ "${{ needs.test-plan.outputs.mode }}" = "full" ]; then
            coverage=(--coverage)
          fi
          dart run tool/changed_test_selector.dart run \
            --manifest "$RUNNER_TEMP/test-plan/changed-tests.json" \
            --package "${{ matrix.package }}" \
            --total-shards "${{ matrix.totalShards }}" \
            --shard-index "${{ matrix.shardIndex }}" \
            "${coverage[@]}"

      - name: Prepare coverage artifact
        if: ${{ success() && needs.test-plan.outputs.mode == 'full' }}
        shell: bash
        run: |
          output="$RUNNER_TEMP/coverage/${{ matrix.artifact }}"
          mkdir -p "$output"
          cp "${{ matrix.package }}/coverage/lcov.info" "$output/lcov.info"
          printf '%s\n' "${{ matrix.package }}" > "$output/package-root"

      - name: Upload coverage artifact
        if: ${{ success() && needs.test-plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.artifact }}
          path: ${{ runner.temp }}/coverage/${{ matrix.artifact }}
          if-no-files-found: error

  coverage:
    name: coverage and Sonar
    needs: [test-plan, test]
    if: ${{ always() && needs.test-plan.outputs.mode == 'full' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage-artifacts
          merge-multiple: false

      - name: Merge LCOV reports for Sonar
        run: |
          dart run tool/merge_lcov.dart \
            --input-root "$RUNNER_TEMP/coverage-artifacts" \
            --output coverage/lcov.info \
            --expected-reports "${{ needs.test-plan.outputs.coverage-report-count }}"

      - name: Check Sonar token availability
        id: check-sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud Scan
        if: ${{ steps.check-sonar-token.outputs.token_available == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.scanner.skipJreProvisioning=true

  ci-success:
    name: ci success
    if: ${{ always() }}
    needs: [change, format, analysis, code-health, integrity, test-plan, test, coverage, platform-builds]
    runs-on: ubuntu-latest
    steps:
      - name: Fail for failed required checks
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: Confirm required checks
        run: echo 'All required CI checks passed or were intentionally skipped.'
