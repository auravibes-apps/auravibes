name: Flutter Test CI

on:
  push:
    branches: [main, dev, stage]
  pull_request:
    branches: [main, dev, stage]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  format:
    name: format
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Check formatting
        run: melos run format:check

      - name: Check import sorting
        run: dart run import_sorter:main --exit-if-changed

  analysis:
    name: analysis
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Analyze
        run: melos analyze

      - name: Test CI tools
        run: dart test tool/changed_test_selector_test.dart tool/merge_lcov_test.dart

  code-health:
    name: code health
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Check unused files
        run: melos run unused:files --no-select

      - name: Check unused code
        run: melos run unused:code --no-select

      - name: Check unnecessary nullable parameters
        run: melos run unnecessary:nullable --no-select

  integrity:
    name: integrity
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check FVM artifact drift
        run: |
          flutter_version="$(ruby -rjson -e 'puts JSON.parse(File.read(".fvmrc")).fetch("flutter")')"
          vscode_sdk_path="$(ruby -rjson -e 'puts JSON.parse(File.read(".vscode/settings.json")).fetch("dart.flutterSdkPath")')"
          expected_path=".fvm/versions/${flutter_version}"

          if [ "$vscode_sdk_path" != "$expected_path" ]; then
            echo "::error::.vscode/settings.json is out of sync with .fvmrc. Run 'fvm use' and commit tracked changes."
            echo "Expected dart.flutterSdkPath: ${expected_path}"
            echo "Actual dart.flutterSdkPath: ${vscode_sdk_path}"
            exit 1
          fi

      - uses: ./.github/actions/setup-workspace

      - name: Check dependency artifact drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Dependency artifacts are out of date. Run 'fvm dart run melos bootstrap', then commit the resulting changes."
            git diff --name-only
            git diff --stat
            git diff --exit-code
          fi

      - name: Validate dependencies
        run: dart run dependency_validator

      - name: Generate code
        run: melos run generate --no-select

      - name: Install matching Serverpod CLI
        run: |
          version="$(ruby -ryaml -e 'puts YAML.load_file("pubspec.lock").fetch("packages").fetch("serverpod").fetch("version")')"
          dart pub global activate serverpod_cli "$version"

      - name: Generate Serverpod code
        run: melos run generate:serverpod

      - name: Check generated artifact drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated artifacts are out of date. Run 'fvm dart run melos run generate' and 'fvm dart run melos run generate:serverpod', then commit the resulting changes."
            git diff --name-only
            git diff --stat
            git diff --exit-code
          fi

  change:
    name: change
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
      run_code_checks: ${{ steps.platforms.outputs.run_code_checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed platforms
        id: platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all_platforms='["android","ios","macos","linux","windows","web"]'
          full_build=false
          run_code_checks=true
          base_sha=''
          head_sha="$GITHUB_SHA"

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$(jq -r '.pull_request.base.sha // empty' "$EVENT_PATH")"
              head_sha="$(jq -r '.pull_request.head.sha // empty' "$EVENT_PATH")"
              ;;
            push)
              base_sha="$(jq -r '.before // empty' "$EVENT_PATH")"
              ;;
            workflow_dispatch)
              full_build=true
              ;;
            *)
              full_build=true
              ;;
          esac

          if [[ "$base_sha" == "" || "$base_sha" =~ ^0+$ ]]; then
            full_build=true
          elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            full_build=true
          elif [[ "$EVENT_NAME" == "push" ]] && ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            full_build=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$head_sha" ]] || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              head_sha=HEAD
            fi
          fi

          if [[ "$full_build" == true ]]; then
            printf 'platforms=%s\n' "$all_platforms" >> "$GITHUB_OUTPUT"
            printf 'run_code_checks=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only --diff-filter=ACDMRTUXB "$base_sha" "$head_sha")"
          platforms=()
          run_code_checks=false

          add_platform() {
            local platform="$1"
            for existing in "${platforms[@]}"; do
              [[ "$existing" == "$platform" ]] && return
            done
            platforms+=("$platform")
          }

          while IFS= read -r path; do
            case "$path" in
              .github/*|.fvm/*|.fvmrc|.vscode/settings.json|assets/*|*/assets/*)
                run_code_checks=true
                ;;
              *.md|*.mdx|README|*/README|CHANGELOG|*/CHANGELOG|LICENSE|*/LICENSE|.pi/*|sonar-project.properties)
                ;;
              *)
                run_code_checks=true
                ;;
            esac

            case "$path" in
              apps/auravibes_app/android/*) add_platform android ;;
              apps/auravibes_app/ios/*) add_platform ios ;;
              apps/auravibes_app/macos/*) add_platform macos ;;
              apps/auravibes_app/linux/*) add_platform linux ;;
              apps/auravibes_app/windows/*) add_platform windows ;;
              apps/auravibes_app/web/*) add_platform web ;;
              apps/auravibes_app/lib/*|apps/auravibes_app/assets/*|packages/*/lib/*|packages/*/assets/*) full_build=true ;;
              apps/auravibes_app/pubspec.yaml|apps/auravibes_app/pubspec.lock|apps/auravibes_app/pubspec_overrides.yaml) full_build=true ;;
              packages/*/pubspec.yaml|packages/*/pubspec.lock|packages/*/pubspec_overrides.yaml) full_build=true ;;
              pubspec.yaml|pubspec.lock|pubspec_overrides.yaml|melos.yaml) full_build=true ;;
              .fvmrc|.fvm/*|.vscode/settings.json) full_build=true ;;
              .github/workflows/ci.yml|.github/workflows/build-matrix.yml|.github/actions/*) full_build=true ;;
            esac
            [[ "$full_build" == true ]] && break
          done <<< "$changed_files"

          if [[ "$full_build" == true ]]; then
            run_code_checks=true
            printf 'platforms=%s\n' "$all_platforms" >> "$GITHUB_OUTPUT"
          elif ((${#platforms[@]} == 0)); then
            printf 'platforms=[]\n' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${platforms[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))' | sed 's/^/platforms=/' >> "$GITHUB_OUTPUT"
          fi
          printf 'run_code_checks=%s\n' "$run_code_checks" >> "$GITHUB_OUTPUT"

  platform-builds:
    name: platform builds
    needs: change
    if: ${{ needs.change.outputs.platforms != '[]' }}
    uses: ./.github/workflows/build-matrix.yml
    with:
      platforms: ${{ needs.change.outputs.platforms }}


  test-plan:
    name: test plan
    needs: change
    if: ${{ needs.change.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      coverage-report-count: ${{ steps.plan.outputs.coverage-report-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Determine test plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="$RUNNER_TEMP/changed-tests.json"
          timings="$RUNNER_TEMP/test-timings.json"
          timing_download="$RUNNER_TEMP/timing-download"
          rm -rf "$timing_download"
          mkdir -p "$timing_download"

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            artifact_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=test-timings" \
              --jq '.artifacts[] | select(.expired == false) | .id' \
              2>/dev/null | head -n 1 || true)"
            [ -n "$artifact_id" ] || continue
            if gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "$timing_download/timings.zip" \
              && unzip -p "$timing_download/timings.zip" '*.json' > "$timings" 2>/dev/null \
              && [ -s "$timings" ]; then
              echo "Using test timings from main run $run_id"
              break
            fi
            rm -f "$timings"
          done < <(gh run list \
            --workflow ci.yml \
            --branch main \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId')

          if [ ! -s "$timings" ]; then
            echo 'No usable historical test timing artifact found; using fixed shards.'
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! dart run tool/changed_test_selector.dart select \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head HEAD \
              --output "$manifest"; then
              printf '%s\n' '{"mode":"full","packages":{},"reason":"selector failed"}' > "$manifest"
            fi
          else
            printf '%s\n' '{"mode":"full","packages":{},"reason":"non-PR run"}' > "$manifest"
          fi

          mode="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("mode")' "$manifest")"
          matrix_args=(
            matrix
            --manifest "$manifest"
            --shard-package apps/auravibes_app \
            --shard-count 3
          )
          if [ -s "$timings" ]; then
            matrix_args+=(--timings "$timings")
          fi
          matrix="$(dart run tool/changed_test_selector.dart "${matrix_args[@]}")"
          report_count="$(ruby -rjson -e 'puts JSON.parse(ARGF.read).fetch("include").length' <<< "$matrix")"

          {
            echo "mode=$mode"
            echo "matrix=$matrix"
            echo "coverage-report-count=$report_count"
          } >> "$GITHUB_OUTPUT"

      - name: Upload test plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-plan
          path: ${{ runner.temp }}/changed-tests.json
          if-no-files-found: error

  test:
    name: test (${{ matrix.package }} shard ${{ matrix.shardIndex }})
    needs: [test-plan]
    if: ${{ needs.test-plan.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Download test plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-plan
          path: ${{ runner.temp }}/test-plan

      - name: Run selected tests
        shell: bash
        env:
          MATRIX_PATHS: ${{ toJSON(matrix.paths) }}
        run: |
          coverage=()
          shards=()
          paths=()
          timings=()
          if [ "${{ needs.test-plan.outputs.mode }}" = "full" ]; then
            coverage=(--coverage)
            timings=(--timings-dir "$RUNNER_TEMP/test-timings")
          fi
          if [ "${{ matrix.shardMode }}" = "timed" ]; then
            paths_file="$RUNNER_TEMP/test-paths.json"
            printf '%s\n' "$MATRIX_PATHS" > "$paths_file"
            paths=(--paths-file "$paths_file")
          else
            shards=(
              --total-shards "${{ matrix.totalShards }}"
              --shard-index "${{ matrix.shardIndex }}"
            )
          fi
          dart run tool/changed_test_selector.dart run \
            --manifest "$RUNNER_TEMP/test-plan/changed-tests.json" \
            --package "${{ matrix.package }}" \
            "${shards[@]}" \
            "${coverage[@]}" \
            "${paths[@]}" \
            "${timings[@]}"

      - name: Upload shard timing
        if: ${{ success() && needs.test-plan.outputs.mode == 'full' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-timing-${{ matrix.artifact }}
          path: ${{ runner.temp }}/test-timings
          if-no-files-found: ignore

      - name: Prepare coverage artifact
        if: ${{ success() && needs.test-plan.outputs.mode == 'full' }}
        shell: bash
        run: |
          output="$RUNNER_TEMP/coverage/${{ matrix.artifact }}"
          mkdir -p "$output"
          cp "${{ matrix.package }}/coverage/lcov.info" "$output/lcov.info"
          printf '%s\n' "${{ matrix.package }}" > "$output/package-root"

      - name: Upload coverage artifact
        if: ${{ success() && needs.test-plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.artifact }}
          path: ${{ runner.temp }}/coverage/${{ matrix.artifact }}
          if-no-files-found: error

  test-timings:
    name: test timings
    needs: [test-plan, test]
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        needs.test-plan.outputs.mode == 'full' &&
        needs.test.result == 'success'
      }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Download shard timings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: test-timing-*
          path: ${{ runner.temp }}/test-timings
          merge-multiple: false

      - name: Merge test timings
        run: |
          dart run tool/changed_test_selector.dart merge-timings \
            --input-root "$RUNNER_TEMP/test-timings" \
            --output "$RUNNER_TEMP/test_timings.json" \
            --source-sha "${{ github.sha }}"

      - name: Upload historical test timings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-timings
          path: ${{ runner.temp }}/test_timings.json
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: coverage and Sonar
    needs: [format, analysis, code-health, integrity, test-plan, test]
    if: >-
      ${{
        always() &&
        needs.format.result == 'success' &&
        needs.analysis.result == 'success' &&
        needs.code-health.result == 'success' &&
        needs.integrity.result == 'success' &&
        needs.test-plan.outputs.mode == 'full' &&
        needs.test.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage-artifacts
          merge-multiple: false

      - name: Merge LCOV reports for Sonar
        run: |
          dart run tool/merge_lcov.dart \
            --input-root "$RUNNER_TEMP/coverage-artifacts" \
            --output coverage/lcov.info \
            --expected-reports "${{ needs.test-plan.outputs.coverage-report-count }}"

      - name: Check Sonar token availability
        id: check-sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud Scan
        if: ${{ steps.check-sonar-token.outputs.token_available == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.scanner.skipJreProvisioning=true

  server-compose:
    name: server-compose / Docker smoke
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          zero_sha=0000000000000000000000000000000000000000
          base=''
          head="$WORKFLOW_SHA"
          relevant=true
          launcher_scripts=false
          range_known=false
          reason='missing or unknown commit range'
          dockerfiles=()

          is_dockerfile_path() {
            case "$1" in
              Dockerfile*|*/Dockerfile*|*.Dockerfile|*/*.Dockerfile)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_docker_related_path() {
            case "$1" in
              .github/workflows/ci.yml|\
              .dockerignore|*/.dockerignore|\
              Dockerfile*|*/Dockerfile*|*.Dockerfile|*/*.Dockerfile|\
              compose*.yml|compose*.yaml|*/compose*.yml|*/compose*.yaml|\
              docker-compose*.yml|docker-compose*.yaml|*/docker-compose*.yml|*/docker-compose*.yaml|\
              scripts/start_server.sh|scripts/stop_server.sh|scripts/serverpod_worktree_env.sh)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          add_dockerfile() {
            local dockerfile="$1"
            local existing
            for existing in "${dockerfiles[@]}"; do
              if [ "$existing" = "$dockerfile" ]; then
                return 0
              fi
            done
            dockerfiles+=("$dockerfile")
          }

          inspect_path() {
            local path="$1"
            if is_docker_related_path "$path"; then
              relevant=true
            fi
            if is_dockerfile_path "$path"; then
              add_dockerfile "$path"
            fi
            case "$path" in
              .dockerignore|*/.dockerignore)
                if [ -f apps/auravibes_server/Dockerfile ]; then
                  add_dockerfile apps/auravibes_server/Dockerfile
                fi
                ;;
              scripts/start_server.sh|scripts/stop_server.sh|scripts/serverpod_worktree_env.sh)
                launcher_scripts=true
                ;;
            esac
          }

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$BEFORE_SHA"
              ;;
          esac

          if [ -n "$head" ] && git cat-file -e "$head^{commit}" 2>/dev/null; then
            if [ -n "$base" ] && [ "$base" != "$zero_sha" ] \
              && git cat-file -e "$base^{commit}" 2>/dev/null; then
              relevant=false
              reason="diff $base..$head"
              if changed_paths="$(git diff --name-only --no-renames "$base" "$head")"; then
                range_known=true
                while IFS= read -r path; do
                  inspect_path "$path"
                done <<< "$changed_paths"
              else
                relevant=true
                reason='unable to diff commit range'
              fi
            else
              reason='missing or initial base SHA'
            fi
          fi

          if [ "$range_known" = false ]; then
            launcher_scripts=true
            if [ -f apps/auravibes_server/Dockerfile ]; then
              add_dockerfile apps/auravibes_server/Dockerfile
            fi
          fi

          {
            printf 'relevant=%s\n' "$relevant"
            printf 'launcher_scripts=%s\n' "$launcher_scripts"
            printf 'reason=%s\n' "$reason"
            printf 'dockerfiles<<DOCKERFILES\n'
            if ((${#dockerfiles[@]} > 0)); then
              printf '%s\n' "${dockerfiles[@]}"
            fi
            printf 'DOCKERFILES\n'
          } >> "$GITHUB_OUTPUT"
          printf 'Relevant Docker changes: %s (%s)\n' "$relevant" "$reason"

      - name: Validate changed Dockerfiles
        if: ${{ steps.changes.outputs.dockerfiles != '' }}
        shell: bash
        env:
          DOCKERFILES: ${{ steps.changes.outputs.dockerfiles }}
        run: |
          set -euo pipefail
          while IFS= read -r dockerfile; do
            [ -n "$dockerfile" ] || continue
            if [ ! -f "$dockerfile" ]; then
              echo "Skipping removed Dockerfile: $dockerfile"
              continue
            fi
            docker build --check --file "$dockerfile" .
          done <<< "$DOCKERFILES"

      - name: Validate Docker launcher scripts
        if: ${{ steps.changes.outputs.launcher_scripts == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/start_server.sh scripts/stop_server.sh scripts/serverpod_worktree_env.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
            fi
          done

      - name: Validate Compose configuration
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        working-directory: apps/auravibes_server
        run: docker compose config --quiet

      - name: Pull Redis images
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        working-directory: apps/auravibes_server
        run: docker compose pull redis redis_test

      - name: Start Redis services
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        working-directory: apps/auravibes_server
        run: docker compose up -d --remove-orphans redis redis_test

      - name: Smoke-test Redis commands
        if: ${{ steps.changes.outputs.relevant == 'true' }}
        working-directory: apps/auravibes_server
        shell: bash
        env:
          REDIS_PASSWORD: UWl-mNHNEUXv_xe0CWFzHBajGK1UV0B1
          REDIS_TEST_PASSWORD: GZZj4HpiGxQK0g_kBQ3qWQMstI9y-Kze
        run: |
          set -euo pipefail

          wait_for_redis() {
            local service="$1"
            local password="$2"
            local response

            for _ in {1..30}; do
              if response="$(docker compose exec -T -e REDISCLI_AUTH="$password" "$service" redis-cli --raw ping 2>/dev/null | tr -d '\r')" \
                && [ "$response" = 'PONG' ]; then
                docker compose exec -T "$service" redis-cli -v
                if [ "$(docker compose exec -T -e REDISCLI_AUTH="$password" "$service" redis-cli --raw set ci-smoke ok | tr -d '\r')" = 'OK' ] \
                  && [ "$(docker compose exec -T -e REDISCLI_AUTH="$password" "$service" redis-cli --raw get ci-smoke | tr -d '\r')" = 'ok' ]; then
