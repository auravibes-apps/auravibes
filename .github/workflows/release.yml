name: Release
on:
  push:
    branches: [main]

jobs:
  build-platforms:
    if: contains(github.event.head_commit.message, 'chore(release)')
    uses: ./.github/workflows/build-matrix.yml

  release:
    name: Create release and update changelog
    needs: build-platforms
    permissions:
      contents: write
    if: contains(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' apps/auravibes_app/pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create tag and release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: auravibes_app-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AuraVibes App v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
